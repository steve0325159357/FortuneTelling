<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>有疑才問 · 易經決策小幫手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&family=LXGW+WenKai+TC&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>:root{
  --bg:#E4EAE6; --paper:#EEF2EF; --deep:#D2DCD6; --ink:#1E2827; --mute:#56635F; --dim:#8A9690; --line:#BFCBC4;
  --accent:#A3652C; --on-accent:#FBF8F3; --ok:#4D7A63; --warn:#9A5A1F;
  --kai:'LXGW WenKai TC','Noto Serif TC',serif; --sans:'Noto Sans TC',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  --r:18px; --pad:clamp(20px,5vw,72px);
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#111513; --paper:#181D1B; --deep:#212826; --ink:#E4E9E5; --mute:#94A09A; --dim:#5F6B66; --line:#2C3532;
  --on-accent:#111513; color-scheme:dark;
}
[data-head="serif"]{ --kai:'Noto Serif TC',serif; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{transition:background .4s,color .4s}
button{font-family:inherit;cursor:pointer;color:inherit}
input,textarea,select{font-family:inherit;color:inherit}
.kai{font-family:var(--kai);font-weight:400}
.mono{font-family:var(--mono)}
.mute{color:var(--mute)}
.accent{color:var(--accent)}
::selection{background:var(--accent);color:var(--on-accent)}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px var(--pad);
  background:color-mix(in oklab,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:border-color .3s}
.hdr.scrolled{border-bottom-color:var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--kai);font-size:22px;background:none;border:0;padding:0}
.logo-mark{width:28px;height:28px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.logo .dot{color:var(--accent)}
.nav{display:flex;gap:6px}
.nav button{background:none;border:0;padding:8px 14px;border-radius:999px;font-size:14px;color:var(--mute);transition:.2s}
.nav button:hover{color:var(--ink)}
.nav button.on{color:var(--ink);background:var(--paper)}
.hdr-tools{display:flex;gap:8px;align-items:center}
.icon-btn{height:36px;min-width:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:.2s}
.icon-btn:hover{border-color:var(--ink)}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.status-dot.on{background:var(--ok)}
.tabbar{display:none}

/* ---------- layout ---------- */
.wrap{padding:0 var(--pad);max-width:1440px;margin:0 auto}
.sec{display:grid;grid-template-columns:260px 1fr;gap:40px;padding:72px 0 64px;border-top:1px solid var(--line);position:relative;transition:opacity .5s}
.sec-head .num{font-family:var(--mono);font-size:12px;color:var(--mute);letter-spacing:1px}
.sec-head h2{font-family:var(--kai);font-weight:400;font-size:30px;line-height:1.35;margin:10px 0 12px}
.sec-head p{font-size:13px;color:var(--mute);line-height:1.8;margin:0;max-width:220px}
.sec.locked{opacity:.32;pointer-events:none;user-select:none}
.sec.locked .sec-head .num::after{content:'  · 尚未開啟';color:var(--dim)}
.sec .done-mark{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ok);margin-top:14px}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:56px;align-items:stretch;padding:56px 0 72px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:2px;color:var(--accent)}
.hero h1{font-family:var(--kai);font-weight:400;font-size:clamp(56px,8.4vw,128px);line-height:1.04;margin:22px 0 0;letter-spacing:-1px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero-lede{font-size:clamp(15px,1.3vw,18px);line-height:1.9;color:var(--mute);max-width:540px;margin:28px 0 36px;text-wrap:pretty}
.hero-actions{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.today{background:var(--paper);border-radius:28px;padding:32px;display:flex;flex-direction:column;justify-content:space-between;gap:28px;position:relative;overflow:hidden}
.today-top{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--mute)}
.today-body{display:flex;align-items:center;gap:36px}
.today-name{font-family:var(--kai);font-size:88px;line-height:1}
.today-quote{font-family:var(--kai);font-size:19px;line-height:1.7}
.ring{position:absolute;right:-90px;top:-90px;width:260px;height:260px;border-radius:50%;border:1px solid var(--line);pointer-events:none}

.principles{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink)}
.principle{padding:28px 28px 28px 0}
.principle+.principle{padding-left:28px;border-left:1px solid var(--line)}
.principle .n{font-family:var(--mono);font-size:11px;color:var(--accent);margin-bottom:14px}
.principle h3{font-family:var(--kai);font-weight:400;font-size:26px;margin:0 0 8px}
.principle p{font-size:14px;line-height:1.8;color:var(--mute);margin:0}

/* ---------- buttons ---------- */
.btn{border:0;border-radius:999px;padding:15px 28px;font-size:15px;letter-spacing:1px;display:inline-flex;align-items:center;gap:10px;transition:transform .15s,background .2s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:hover{background:var(--accent);color:var(--on-accent)}
.btn.accent{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.sm{padding:9px 16px;font-size:13px;letter-spacing:0}
.btn:disabled{opacity:.35;pointer-events:none}
.link{background:none;border:0;padding:0 0 2px;border-bottom:1px solid currentColor;font-size:14px}
.kbd{font-family:var(--mono);font-size:10px;opacity:.6}

/* ---------- meditation ---------- */
.medi{display:grid;grid-template-columns:auto 1fr;gap:56px;align-items:center;background:var(--paper);border-radius:28px;padding:48px}
.medi-vert{writing-mode:vertical-rl;font-family:var(--kai);font-size:24px;letter-spacing:10px;line-height:2.3;color:var(--ink);height:300px}
.medi-vert span{opacity:.18;transition:opacity 1.2s}
.medi-vert span.lit{opacity:1}
.breath{width:120px;height:120px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;position:relative;margin-bottom:24px}
.breath::before{content:'';position:absolute;inset:18px;border-radius:50%;background:var(--accent);opacity:.14;animation:breath 8s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(.55)}50%{transform:scale(1.08)}}

/* ---------- composer (B) ---------- */
.composer{background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 30px 70px -40px rgba(20,40,35,.35)}
.composer-top{padding:24px 28px 8px}
.composer-meta{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:8px}
.composer textarea{width:100%;border:0;background:transparent;resize:none;outline:none;font-family:var(--kai);font-size:clamp(20px,2vw,26px);line-height:1.55;padding:14px 0 4px;min-height:96px}
.composer textarea::placeholder{color:var(--dim)}
.hint{font-size:12px;color:var(--mute);line-height:1.7}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:14px 28px 18px}
.chip{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:12px;font-size:14px;background:var(--bg);color:var(--mute);border:1px solid var(--line);transition:.2s}
.chip .ch{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-family:var(--kai);font-size:16px;background:var(--deep);color:var(--ink);transition:.2s}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.on .ch{background:var(--accent);color:var(--on-accent)}
.chip small{font-size:11px;opacity:.7;margin-left:2px}
.composer-foot{border-top:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:color-mix(in oklab,var(--paper) 60%,var(--bg))}
.examples{display:flex;gap:8px;flex-wrap:wrap}
.examples button{background:none;border:1px dashed var(--line);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--mute)}
.examples button:hover{color:var(--ink);border-color:var(--mute)}
.repeat-warn{margin:14px 0 0;padding:14px 18px;border-radius:14px;background:color-mix(in oklab,var(--accent) 12%,var(--paper));font-size:13px;line-height:1.8}

/* ---------- methods ---------- */
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.method{background:var(--paper);border:1px solid transparent;border-radius:var(--r);padding:24px;text-align:left;display:flex;flex-direction:column;gap:14px;transition:.25s;position:relative}
.method:hover{border-color:var(--line);transform:translateY(-2px)}
.method.on{border-color:var(--ink);background:var(--paper);box-shadow:inset 0 0 0 1px var(--ink)}
.method-top{display:flex;justify-content:space-between;align-items:flex-start}
.method .idx{font-family:var(--mono);font-size:11px;color:var(--mute)}
.method h3{font-family:var(--kai);font-weight:400;font-size:24px;margin:4px 0 0}
.method .sub{font-size:12px;color:var(--mute);margin-top:4px}
.level{display:flex;gap:3px}
.level i{width:7px;height:7px;background:var(--line);display:block}
.level i.f{background:var(--accent)}
.method dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;line-height:1.65}
.method dt{color:var(--dim);font-size:12px;white-space:nowrap;padding-top:1px}
.method dd{margin:0;color:var(--ink)}
.method .glyph{font-size:28px;line-height:1;color:var(--accent)}

/* ---------- stage (divination) ---------- */
.stage{background:var(--paper);border-radius:28px;padding:40px;display:grid;grid-template-columns:1fr 240px;gap:40px;min-height:440px}
.stage-main{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;min-width:0}
.stage-side{border-left:1px solid var(--line);padding-left:32px;display:flex;flex-direction:column;gap:16px}
.stage-side h4{margin:0;font-size:12px;color:var(--mute);font-weight:400;font-family:var(--mono);letter-spacing:1px}
.building{display:flex;flex-direction:column-reverse;gap:10px}
.build-row{display:grid;grid-template-columns:36px 1fr 52px;align-items:center;gap:10px;font-size:12px;color:var(--mute);min-height:22px}
.build-row .yao-slot{height:9px}
.build-row.empty .yao-slot{border-top:1px dashed var(--line);height:0}
.instr{font-size:14px;color:var(--mute);text-align:center;line-height:1.8;max-width:460px}

/* hex */
.hex{display:flex;flex-direction:column-reverse}
.yao{display:flex;justify-content:space-between;background:none;position:relative}
.yao i{display:block;height:100%;background:var(--c,var(--ink))}
.yao.yang i:first-child{width:100%}
.yao.yang i:last-child{display:none}
.yao.yin i{width:42%}
.yao.mov{--c:var(--accent)}
.yao.anim{animation:yaoIn .7s cubic-bezier(.2,.7,.2,1) both;transform-origin:left}
@keyframes yaoIn{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}

/* coins */
.coins{display:flex;gap:clamp(14px,3vw,36px);perspective:900px;height:150px;align-items:flex-end}
.coin{width:clamp(76px,10vw,104px);aspect-ratio:1;position:relative;transform-style:preserve-3d;transition:transform .3s}
.coin.spin{animation:coinToss 1.25s cubic-bezier(.3,.6,.35,1) both}
@keyframes coinToss{0%{transform:translateY(0) rotateY(0) rotateX(0)}45%{transform:translateY(-110px) rotateY(900deg) rotateX(25deg)}80%{transform:translateY(6px) rotateY(1620deg) rotateX(0)}}
.coin-face{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#D9B57A,#A87A3D 60%,#7C5528);box-shadow:inset 0 0 0 5px #8D6431,inset 0 0 0 7px #C69A5A,0 10px 20px -10px rgba(0,0,0,.5)}
.coin-face.back{transform:rotateY(180deg);background:radial-gradient(circle at 35% 30%,#C9A46A,#94692F 60%,#6E4920)}
.coin-hole{width:24%;aspect-ratio:1;background:var(--paper);box-shadow:0 0 0 3px #8D6431;position:relative;z-index:1}
.coin-chars{position:absolute;inset:12%;font-family:'Noto Serif TC',serif;font-weight:700;color:#4A3014;font-size:clamp(13px,1.6vw,17px)}
.coin-chars span{position:absolute}
.coin-chars span:nth-child(1){top:0;left:50%;transform:translateX(-50%)}
.coin-chars span:nth-child(2){bottom:0;left:50%;transform:translateX(-50%)}
.coin-chars span:nth-child(3){right:0;top:50%;transform:translateY(-50%)}
.coin-chars span:nth-child(4){left:0;top:50%;transform:translateY(-50%)}
.coin-label{text-align:center;font-size:12px;color:var(--mute);margin-top:10px;font-family:var(--mono)}

/* yarrow */
.tube-wrap{position:relative;height:230px;width:220px;display:flex;justify-content:center;align-items:flex-end}
.tube{width:96px;height:150px;border-radius:12px 12px 22px 22px;background:linear-gradient(90deg,#6E4E2E,#9A7246 45%,#6E4E2E);position:relative;z-index:2;box-shadow:inset 0 -8px 0 rgba(0,0,0,.2)}
.tube::before{content:'';position:absolute;left:0;right:0;top:34px;height:4px;background:rgba(0,0,0,.25)}
.tube::after{content:'';position:absolute;left:0;right:0;bottom:30px;height:4px;background:rgba(0,0,0,.25)}
.tube.shake{animation:shake .9s ease-in-out}
@keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-9deg)}30%{transform:rotate(8deg)}45%{transform:rotate(-7deg)}60%{transform:rotate(6deg)}75%{transform:rotate(-3deg)}}
.sticks{position:absolute;bottom:120px;left:50%;width:84px;margin-left:-42px;height:100px;z-index:1}
.stick{position:absolute;bottom:0;width:4px;height:96px;border-radius:2px;background:linear-gradient(#E1C997,#B89458);transform-origin:bottom center}
.stick.fly{animation:fly 1s cubic-bezier(.2,.7,.3,1) both}
@keyframes fly{0%{transform:translate(0,0) rotate(var(--r0))}100%{transform:translate(var(--tx),-120px) rotate(var(--r1));opacity:0}}
.changes{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.change{background:var(--bg);border-radius:12px;padding:10px 14px;font-family:var(--mono);font-size:12px;color:var(--mute);text-align:center;animation:fadeUp .5s both}
.change b{display:block;color:var(--ink);font-size:16px;font-weight:500;margin-top:2px}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* numbers */
.num-inputs{display:flex;gap:clamp(12px,3vw,32px);align-items:flex-end;flex-wrap:wrap;justify-content:center}
.num-field{display:flex;flex-direction:column;align-items:center;gap:8px}
.num-field label{font-size:12px;color:var(--mute)}
.num-field input{width:clamp(110px,14vw,150px);text-align:center;font-family:var(--mono);font-size:clamp(38px,5vw,54px);border:0;border-bottom:2px solid var(--ink);background:transparent;outline:none;padding:4px 0;letter-spacing:4px}
.num-field input:focus{border-color:var(--accent)}
.calc{font-family:var(--mono);font-size:12px;color:var(--mute);line-height:2;text-align:left}

/* cards */
.deck{position:relative;width:100%;max-width:640px;height:240px}
.zcard{position:absolute;left:50%;top:10px;width:120px;height:184px;margin-left:-60px;perspective:900px;transition:transform .6s cubic-bezier(.2,.7,.2,1),opacity .4s;background:none;border:0;padding:0}
.zcard-in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,.7,.2,1)}
.zcard.flip .zcard-in{transform:rotateY(180deg)}
.zcard-f,.zcard-b{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.zcard-b{background:var(--ink);border:1px solid var(--ink);box-shadow:0 14px 30px -14px rgba(0,0,0,.45)}
.zcard-b::before{content:'';position:absolute;inset:8px;border:1px solid color-mix(in oklab,var(--bg) 30%,transparent);border-radius:8px}
.zcard-b .seal{font-family:var(--kai);color:var(--bg);font-size:28px;opacity:.85}
.zcard-f{background:var(--bg);border:1px solid var(--line);transform:rotateY(180deg);box-shadow:0 20px 40px -18px rgba(0,0,0,.4)}
.zcard-f .nm{font-family:var(--kai);font-size:26px}
.zcard-f .no{font-family:var(--mono);font-size:10px;color:var(--mute)}
.zcard.pickable:hover{transform:var(--t) translateY(-14px)!important}
.shuffle .zcard{animation:shuf .5s ease-in-out 3 alternate}
@keyframes shuf{to{transform:translateX(var(--sx)) rotate(var(--sr))}}

/* dice */
.dice{display:flex;gap:clamp(18px,4vw,48px);align-items:center;justify-content:center;flex-wrap:wrap}
.die{display:flex;flex-direction:column;align-items:center;gap:12px}
.die-body{width:96px;height:96px;display:grid;place-items:center;position:relative}
.die-body .shape{position:absolute;inset:0;background:var(--bg);border:1.5px solid var(--ink);box-shadow:0 12px 24px -14px rgba(0,0,0,.5)}
.die-body.d8 .shape{transform:rotate(45deg) scale(.74);border-radius:10px}
.die-body.d6 .shape{border-radius:18px;transform:scale(.86)}
.die-body .val{position:relative;text-align:center;line-height:1.1}
.die-body .val b{display:block;font-family:var(--mono);font-size:28px;font-weight:500}
.die-body .val small{font-size:13px;color:var(--accent)}
.die-body.roll{animation:roll 1.1s cubic-bezier(.3,.6,.3,1)}
@keyframes roll{0%{transform:translate(0,0) rotate(0)}30%{transform:translate(-14px,-60px) rotate(240deg)}60%{transform:translate(10px,0) rotate(480deg)}80%{transform:translate(0,-14px) rotate(620deg)}100%{transform:none}}
.die .cap{font-size:12px;color:var(--mute)}

/* ---------- result ---------- */
.res-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:32px;background:var(--paper);border-radius:28px;padding:44px}
.res-hex{display:flex;gap:28px;align-items:center}
.res-hex.right{justify-content:flex-end}
.res-hex .lbl{font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:1px}
.res-hex .nm{font-family:var(--kai);font-size:clamp(44px,5vw,64px);line-height:1.1;margin:6px 0}
.res-hex .sub{font-size:13px;color:var(--mute)}
.res-arrow{font-family:var(--mono);color:var(--mute);font-size:13px;text-align:center}
.res-arrow .ln{width:60px;height:1px;background:var(--line);margin:8px auto}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.panel{background:var(--paper);border-radius:22px;padding:28px}
.panel h4{margin:0 0 16px;font-family:var(--mono);font-size:11px;font-weight:400;color:var(--mute);letter-spacing:1px;display:flex;justify-content:space-between;align-items:center}
.focus-txt{font-family:var(--kai);font-size:21px;line-height:1.7;margin:0 0 10px}
.focus-txt small{font-family:var(--sans);font-size:12px;color:var(--accent);margin-right:8px;vertical-align:3px}
.lines-tbl{display:flex;flex-direction:column}
.line-row{display:grid;grid-template-columns:48px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.7}
.line-row:first-child{border-top:0}
.line-row .lab{font-family:var(--kai);font-size:15px}
.line-row.mov .lab,.line-row.mov .txt{color:var(--accent)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:11px;padding:1px 8px;border-radius:6px;background:var(--bg);color:var(--mute)}
.tag.good{color:var(--ok)}
.tag.bad{color:var(--warn)}

.reading{background:var(--paper);border-radius:28px;padding:44px clamp(24px,5vw,64px);margin-top:16px;position:relative}
.reading-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.md{font-size:15px;line-height:1.95;max-width:760px}
.md h2,.md h3{font-family:var(--kai);font-weight:400;font-size:23px;margin:32px 0 10px;padding-top:24px;border-top:1px solid var(--line)}
.md h2:first-child,.md h3:first-child{border-top:0;padding-top:0;margin-top:8px}
.md h4{font-size:15px;margin:20px 0 6px}
.md p{margin:0 0 12px}
.md ul,.md ol{margin:0 0 12px;padding-left:22px}
.md li{margin:4px 0}
.md strong{color:var(--ink);font-weight:600;background:linear-gradient(transparent 62%,color-mix(in oklab,var(--accent) 22%,transparent) 0)}
.md blockquote{margin:0 0 20px;padding:14px 18px;border-radius:12px;background:var(--bg);color:var(--mute);font-size:13px}
.md blockquote p{margin:0}
.md pre{background:var(--bg);border-radius:12px;padding:16px;font-family:var(--mono);font-size:13px;line-height:1.5;overflow:auto}
.md code{font-family:var(--mono);font-size:.9em;background:var(--bg);padding:1px 5px;border-radius:4px}
.md hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.shimmer{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--deep),var(--bg),var(--deep));background-size:200% 100%;animation:shim 1.4s linear infinite;margin:12px 0}
@keyframes shim{to{background-position:-200% 0}}
.notice{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start;margin-top:16px;padding:28px 32px;border-radius:22px;border:1px solid var(--line)}
.notice .glyph{font-family:var(--kai);font-size:34px;color:var(--accent);line-height:1}
.notice h4{margin:0 0 6px;font-family:var(--kai);font-weight:400;font-size:20px}
.notice p{margin:0;font-size:14px;line-height:1.85;color:var(--mute)}
.res-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}

/* ---------- pages ---------- */
.page-hd{padding:56px 0 32px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.page-hd h1{font-family:var(--kai);font-weight:400;font-size:clamp(40px,5vw,64px);margin:12px 0 0;line-height:1.1}
.page-hd p{color:var(--mute);font-size:14px;line-height:1.8;margin:12px 0 0;max-width:520px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:16px 0 20px;border-top:1px solid var(--ink)}
.search{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:999px;padding:0 18px;height:44px;overflow:hidden}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0;font-size:14px;height:100%}
@media (max-width:640px){.toolbar{row-gap:12px}.toolbar .search{flex:1 1 100%}}
.select{height:44px;border-radius:999px;border:1px solid var(--line);background:transparent;padding:0 16px;font-size:13px}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:24px}
.fchip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:13px;color:var(--mute)}
.fchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;padding-bottom:80px}
.rec{background:var(--paper);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:16px;text-align:left;border:1px solid transparent;transition:.2s;animation:fadeUp .4s both}
.rec:hover{border-color:var(--line)}
.rec-top{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:11px;color:var(--mute)}
.rec-q{font-family:var(--kai);font-size:20px;line-height:1.5;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rec-hex{display:flex;align-items:center;gap:14px}
.rec-hex .t{font-family:var(--kai);font-size:16px}
.rec-hex .m{font-size:12px;color:var(--mute)}
.rec-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:14px}
.empty{padding:80px 20px;text-align:center;color:var(--mute);background:var(--paper);border-radius:28px;margin-bottom:80px}
.empty .kai{font-size:28px;color:var(--ink);display:block;margin-bottom:10px}

/* library */
.basics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.basic{background:var(--paper);border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:16px}
.basic h3{font-family:var(--kai);font-weight:400;font-size:24px;margin:0}
.basic p{margin:0;font-size:13px;line-height:1.85;color:var(--mute)}
.bagua-wrap{display:grid;grid-template-columns:auto 1fr;gap:48px;align-items:center;background:var(--paper);border-radius:28px;padding:40px;margin-top:14px}
.bagua{position:relative;width:340px;height:340px}
.bagua .tg{position:absolute;left:50%;top:50%;width:70px;margin:-35px 0 0 -35px;text-align:center;transition:transform .8s cubic-bezier(.3,.7,.2,1)}
.bagua .tg .sym{font-size:30px;line-height:1}
.bagua .tg .n{font-family:var(--kai);font-size:16px;margin-top:4px}
.bagua .tg .d{font-size:10px;color:var(--mute);font-family:var(--mono)}
.bagua .core{position:absolute;inset:110px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--kai);font-size:18px;color:var(--mute);text-align:center;line-height:1.4}
.tri-tbl{width:100%;border-collapse:collapse;font-size:13px}
.tri-tbl th{font-weight:400;color:var(--mute);font-size:11px;text-align:left;padding:8px 6px;border-bottom:1px solid var(--ink);font-family:var(--mono)}
.tri-tbl td{padding:9px 6px;border-bottom:1px solid var(--line)}
.tri-tbl td.sym{font-size:22px;line-height:1}
.seg{display:inline-flex;background:var(--bg);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 14px;font-size:13px;color:var(--mute)}
.seg button.on{background:var(--ink);color:var(--bg)}
.matrix-wrap{background:var(--paper);border-radius:28px;padding:32px;margin:14px 0 80px;overflow-x:auto}
.matrix{display:grid;grid-template-columns:64px repeat(8,minmax(78px,1fr));gap:4px;min-width:760px}
.mx-h{font-size:11px;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 0;text-align:center}
.mx-h .sym{font-size:20px;color:var(--ink)}
.mx-c{border:0;background:var(--bg);border-radius:12px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:.2s}
.mx-c:hover{background:var(--ink);color:var(--bg)}
.mx-c:hover .yao{--c:var(--bg)}
.mx-c .nm{font-family:var(--kai);font-size:15px}
.mx-c .no{font-family:var(--mono);font-size:9px;opacity:.55}
.mx-c.dim{opacity:.2}

/* drawer / modal */
.scrim{position:fixed;inset:0;background:rgba(10,16,14,.42);z-index:60;animation:fade .25s both;backdrop-filter:blur(2px)}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100vw);background:var(--bg);z-index:61;overflow-y:auto;animation:slide .4s cubic-bezier(.2,.7,.2,1) both;box-shadow:-30px 0 60px -30px rgba(0,0,0,.4)}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.drawer-hd{position:sticky;top:0;background:color-mix(in oklab,var(--bg) 90%,transparent);backdrop-filter:blur(10px);display:flex;justify-content:space-between;align-items:center;padding:16px 28px;border-bottom:1px solid var(--line);z-index:2}
.drawer-body{padding:28px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 32px));background:var(--bg);border-radius:24px;z-index:61;padding:32px;animation:pop .3s cubic-bezier(.2,.7,.2,1) both;max-height:90vh;overflow:auto}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%)}}
.field{display:flex;flex-direction:column;gap:8px;margin:18px 0}
.field label{font-size:12px;color:var(--mute)}
.field input,.field select{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--paper);padding:0 14px;font-size:14px;outline:none}
.field input:focus{border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-size:14px;z-index:90;animation:fadeUp .3s both}

/* splash */
.splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:32px;cursor:pointer;transition:opacity .8s}
.splash.out{opacity:0;pointer-events:none}
.splash-in{max-width:720px;text-align:center}
.splash .l{opacity:0;animation:sIn 1s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes sIn{from{opacity:0;transform:translateY(10px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.splash h1{font-family:var(--kai);font-weight:400;font-size:clamp(48px,8vw,96px);margin:0 0 20px}
.splash .p{font-size:15px;color:var(--mute);line-height:1.9;margin:0 auto 32px;max-width:520px}
.splash .three{display:flex;justify-content:center;gap:clamp(16px,4vw,48px);margin-bottom:32px;font-family:var(--kai);font-size:clamp(18px,2.4vw,24px)}
.splash .three span b{color:var(--accent);font-weight:400}
.splash .warn{font-size:12px;color:var(--mute);border-top:1px solid var(--line);padding-top:20px;max-width:520px;margin:0 auto}
.splash .skip{position:fixed;right:24px;bottom:24px;font-size:12px;color:var(--mute);font-family:var(--mono);border:1px solid var(--line);border-radius:999px;padding:8px 14px;background:transparent}
.splash .bar{position:fixed;left:0;bottom:0;height:2px;background:var(--accent);animation:bar 4.2s linear forwards}
@keyframes bar{from{width:0}to{width:100%}}

.foot{border-top:1px solid var(--line);padding:28px 0 40px;display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--mute);flex-wrap:wrap}

/* pdf report */
.pdf-host{position:fixed;left:-10000px;top:0;width:794px;pointer-events:none}
.pdf{width:794px;background:#fff;color:#1E2827;padding:56px 64px;font-family:'Noto Sans TC',sans-serif}
.pdf .kai{font-family:'LXGW WenKai TC',serif}
.pdf .md{max-width:none;font-size:13px;line-height:1.85}
.pdf .md strong{background:none;color:#1E2827}
.pdf .md blockquote,.pdf .md pre,.pdf .md code{background:#F1F4F2;color:#56635F}
.pdf .md h2,.pdf .md h3{font-size:19px;border-top-color:#D5DDD8;page-break-after:avoid}
.pdf .yao{--c:#1E2827}
.pdf .yao.mov{--c:#A3652C}

/* ---------- responsive ---------- */
@media (max-width:1080px){
  .methods{grid-template-columns:repeat(2,1fr)}
  .basics{grid-template-columns:1fr 1fr}
}
@media (max-width:860px){
  .nav,.hdr-tools .hide-m{display:none}
  .hdr{padding:12px var(--pad)}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;background:color-mix(in oklab,var(--paper) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 0 calc(10px + env(safe-area-inset-bottom))}
  .tabbar button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--mute);padding:6px 0;min-height:48px}
  .tabbar button .g{font-family:var(--kai);font-size:18px}
  .tabbar button.on{color:var(--ink)}
  .tabbar button.on .g{color:var(--accent)}
  body{padding-bottom:76px}
  .hero{grid-template-columns:1fr;gap:32px;padding:28px 0 48px}
  .today{padding:24px;border-radius:22px}
  .today-name{font-size:64px}
  .principles{grid-template-columns:1fr}
  .principle,.principle+.principle{padding:20px 0;border-left:0;border-bottom:1px solid var(--line)}
  .sec{grid-template-columns:1fr;gap:20px;padding:48px 0 40px}
  .sec-head p{max-width:none}
  .sec-head h2{font-size:26px;margin-bottom:6px}
  .medi{grid-template-columns:1fr;padding:28px 22px;gap:24px;border-radius:22px}
  .medi-vert{writing-mode:horizontal-tb;height:auto;font-size:19px;letter-spacing:3px;line-height:1.9}
  .medi-vert span{display:block}
  .composer-top,.chips,.composer-foot{padding-left:18px;padding-right:18px}
  .composer-foot{flex-direction:column;align-items:stretch}
  .composer-foot .btn{justify-content:center}
  .methods{grid-template-columns:1fr}
  .stage{grid-template-columns:1fr;padding:24px 18px;border-radius:22px;gap:24px}
  .stage-side{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:20px}
  .res-head{grid-template-columns:1fr;padding:28px 22px;gap:20px;border-radius:22px}
  .res-hex.right{justify-content:flex-start}
  .res-arrow .ln{width:1px;height:24px}
  .res-grid{grid-template-columns:1fr}
  .reading{padding:28px 20px;border-radius:22px}
  .notice{grid-template-columns:1fr;padding:22px}
  .basics{grid-template-columns:1fr}
  .bagua-wrap{grid-template-columns:1fr;padding:24px;justify-items:center}
  .bagua{width:290px;height:290px}
  .bagua .core{inset:95px}
  .matrix-wrap{padding:16px;border-radius:22px}
  .rec-grid{grid-template-columns:1fr}
  .deck{height:220px}
  .zcard{width:96px;height:148px;margin-left:-48px}
}

/* ===== v2 ===== */
.plain{font-size:12.5px;color:var(--mute);line-height:1.75;margin-top:3px}
.line-row.mov .plain{color:color-mix(in oklab,var(--accent) 70%,var(--mute))}
.build-row.cur span:first-child{color:var(--accent)}
.build-row.cur.empty .yao-slot{border-top-color:var(--accent);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}

/* askai */
.askai{margin-top:16px;display:grid;grid-template-columns:1fr auto;gap:20px 32px;align-items:center;padding:28px 32px;border-radius:22px;background:var(--ink);color:var(--bg)}
.askai h4{font-size:26px;font-weight:400;margin:6px 0 8px}
.askai p{margin:0;font-size:13.5px;line-height:1.85;opacity:.78;max-width:620px}
.askai p b{color:var(--accent);font-weight:500;opacity:1}
.askai .mute{color:color-mix(in oklab,var(--bg) 60%,transparent)!important}
.askai-r{display:flex;flex-direction:column;align-items:center;gap:10px}
.askai-r .btn{padding:16px 30px;font-size:16px}
.askai-ok{margin-top:12px;font-size:13px;color:var(--accent)}
.askai-prompt{grid-column:1/-1;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.askai-prompt pre{width:100%;max-height:300px;overflow:auto;margin:0;padding:16px;border-radius:12px;background:color-mix(in oklab,var(--bg) 8%,transparent);font-family:var(--mono);font-size:12px;line-height:1.65;white-space:pre-wrap;color:color-mix(in oklab,var(--bg) 85%,transparent)}
.askai-prompt .btn.ghost{color:var(--bg);border-color:color-mix(in oklab,var(--bg) 30%,transparent)}

/* coins v2 */
.coin-table{position:relative;display:flex;gap:clamp(14px,4vw,44px);height:220px;align-items:flex-end;padding-bottom:30px;perspective:1000px}
.table-line{position:absolute;left:-10%;right:-10%;bottom:28px;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.coin-slot{position:relative;display:flex;flex-direction:column;align-items:center}
.coin-fly{width:clamp(74px,10vw,100px);aspect-ratio:1;transform-style:preserve-3d;position:relative;z-index:2}
.coin-fly.go{animation:arc 1.4s cubic-bezier(.25,.7,.35,1) both}
@keyframes arc{0%{transform:translateY(0)}38%{transform:translateY(-150px)}72%{transform:translateY(0)}82%{transform:translateY(-16px)}90%{transform:translateY(0)}95%{transform:translateY(-4px)}100%{transform:translateY(0)}}
.coin-fly.rattle{animation:rattle .12s linear infinite}
@keyframes rattle{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-3px,-4px) rotate(-6deg)}50%{transform:translate(2px,-1px) rotate(4deg)}75%{transform:translate(3px,-5px) rotate(-3deg)}}
.coin3d{position:absolute;inset:0;transform-style:preserve-3d;transition-property:transform;transition-timing-function:cubic-bezier(.2,.6,.3,1)}
.cface{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;transform:translateZ(3px);
  background:radial-gradient(circle at 32% 28%,#E6C589 0%,#B98845 45%,#86592A 100%);box-shadow:inset 0 0 0 4px #7E5626,inset 0 0 0 6px #D2A863,inset 0 0 18px rgba(60,30,0,.35)}
.cface.back{transform:rotateX(180deg) translateZ(3px);background:radial-gradient(circle at 32% 28%,#D7B47A 0%,#A27235 50%,#704A1E 100%)}
.cmid{position:absolute;inset:1px;border-radius:50%;background:#6B4519;transform:translateZ(0)}
.coin-ring{position:absolute;inset:22%;border-radius:50%;border:2px solid rgba(80,45,10,.4)}
.coin-hole{width:24%;aspect-ratio:1;background:var(--paper);box-shadow:0 0 0 3px #7E5626,inset 0 2px 4px rgba(0,0,0,.25);position:relative;z-index:1}
.coin-shadow{position:absolute;bottom:-6px;left:50%;width:76%;height:12px;margin-left:-38%;border-radius:50%;background:radial-gradient(ellipse,rgba(20,30,25,.35),transparent 70%);z-index:1}
.coin-shadow.go{animation:shadow 1.4s cubic-bezier(.25,.7,.35,1) both}
@keyframes shadow{0%{transform:scale(1);opacity:1}38%{transform:scale(.45);opacity:.35}72%{transform:scale(1);opacity:1}82%{transform:scale(.85)}100%{transform:scale(1)}}
.coin-label{margin-top:16px}
.toss-result{min-height:48px;display:flex;flex-direction:column;align-items:center;gap:4px;animation:fadeUp .4s both}
.toss-result .mono{font-size:13px;color:var(--mute)}
.toss-result b{font-size:24px;font-weight:400}

/* yarrow v2 */
.yarrow-table{position:relative;width:100%;max-width:640px;background:color-mix(in oklab,var(--bg) 70%,var(--paper));border-radius:18px;overflow:hidden}
.ystick{position:absolute;left:0;top:0;border-radius:2px;background:linear-gradient(#E9D3A2,#BE9A5C 60%,#9C7840);transform-origin:50% 0;transition-property:transform,background,opacity;transition-timing-function:cubic-bezier(.3,.7,.2,1);box-shadow:0 1px 0 rgba(0,0,0,.08)}
.ystick.g1{background:linear-gradient(#D7B57A,#A57D41)}
.ystick.g0{background:linear-gradient(#F0DEB4,#C7A468)}
.ystick.rem{background:linear-gradient(var(--accent),color-mix(in oklab,var(--accent) 70%,#000))}
.ystick.hang{background:var(--accent)}
.ystick.out{opacity:.7}
.taiji-stick{position:absolute;left:16px;top:14px;display:flex;align-items:center;gap:8px;font-size:10px;color:var(--mute);font-family:var(--mono)}
.taiji-stick i{width:28px;height:3px;border-radius:2px;background:var(--accent);opacity:.7}
.yt-label{position:absolute;bottom:14px;font-size:11px;color:var(--mute);font-family:var(--mono);transition:opacity .4s}
.yt-label.l{left:18%}.yt-label.r{left:64%}
.yt-tray{position:absolute;right:10px;bottom:10px;width:58px;height:46px;border-radius:10px;border:1px dashed var(--line);display:flex;align-items:flex-start;justify-content:center;padding-top:4px;font-size:10px;color:var(--mute)}
.yarrow-caption{font-size:19px;min-height:30px;text-align:center;animation:fadeUp .4s both}
.change span{display:block;font-size:10px;margin-top:2px}

/* number v2 */
.num-compose{display:flex;flex-direction:column;align-items:center;gap:22px;width:100%}
.nc-nums{font-size:clamp(26px,4vw,40px);letter-spacing:4px}
.nc-row{display:flex;align-items:center;gap:clamp(10px,2.4vw,24px);flex-wrap:wrap;justify-content:center}
.nc-tri,.nc-hex{background:var(--bg);border-radius:16px;padding:16px 18px;min-width:108px;text-align:center;opacity:0;transform:translateY(10px) scale(.96);transition:all .55s cubic-bezier(.2,.7,.2,1)}
.nc-hex{min-width:130px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--ink);color:var(--bg)}
.nc-hex .yao{--c:var(--bg)}.nc-hex .yao.mov{--c:var(--accent)}
.nc-tri.on,.nc-hex.on,.nc-plus.on,.nc-move.on{opacity:1;transform:none}
.nc-tri .lbl{font-size:11px;color:var(--mute);font-family:var(--mono)}
.nc-tri .sym{font-size:44px;line-height:1.1;margin:6px 0}
.nc-tri .mono{font-size:10px;margin-top:6px}
.nc-plus{font-size:22px;color:var(--mute);opacity:0;transition:opacity .4s}
.nc-move{font-size:13px;color:var(--accent);opacity:0;transform:translateY(6px);transition:all .5s}

/* cards v2 */
.deck2{position:relative;width:100%;max-width:760px}
.zc{position:absolute;left:50%;top:22px;background:none;border:0;padding:0;perspective:1000px;transition:transform .65s cubic-bezier(.25,.75,.25,1),opacity .5s}
.zc:disabled{cursor:default}
.zc-in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.3,.7,.2,1) .25s}
.zc.flip .zc-in{transform:rotateY(180deg)}

    [29,'坎','坎為水','坎','坎','習坎，有孚，維心亨，行有尚。','習坎，入于坎窞，凶。|坎有險，求小得。|來之坎坎，險且枕，入于坎窞，勿用。|樽酒簋貳，用缶，納約自牖，終无咎。|坎不盈，祇既平，无咎。|係用徽纆，寘于叢棘，三歲不得，凶。','重重險陷，守住信念、步步為營。'],
    [30,'離','離為火','離','離','利貞，亨。畜牝牛，吉。','履錯然，敬之无咎。|黃離，元吉。|日昃之離，不鼓缶而歌，則大耋之嗟，凶。|突如其來如，焚如，死如，棄如。|出涕沱若，戚嗟若，吉。|王用出征，有嘉折首，獲匪其醜，无咎。','光明依附，找到值得依附的正道。'],
    [31,'咸','澤山咸','兌','艮','亨，利貞，取女吉。','咸其拇。|咸其腓，凶，居吉。|咸其股，執其隨，往吝。|貞吉悔亡，憧憧往來，朋從爾思。|咸其脢，无悔。|咸其輔頰舌。','相互感應，以真誠打動人心。'],
    [32,'恆','雷風恆','震','巽','亨，无咎，利貞，利有攸往。','浚恆，貞凶，无攸利。|悔亡。|不恆其德，或承之羞，貞吝。|田无禽。|恆其德，貞，婦人吉，夫子凶。|振恆，凶。','持之以恆，守常而能變通。'],
    [33,'遯','天山遯','乾','艮','亨，小利貞。','遯尾，厲，勿用有攸往。|執之用黃牛之革，莫之勝說。|係遯，有疾厲，畜臣妾吉。|好遯，君子吉，小人否。|嘉遯，貞吉。|肥遯，无不利。','適時退避，保全實力。'],
    [34,'大壯','雷天大壯','震','乾','利貞。','壯于趾，征凶，有孚。|貞吉。|小人用壯，君子用罔，貞厲。羝羊觸藩，羸其角。|貞吉悔亡，藩決不羸，壯于大輿之輹。|喪羊于易，无悔。|羝羊觸藩，不能退，不能遂，无攸利，艱則吉。','聲勢強盛，更要守正、不妄動。'],
    [35,'晉','火地晉','離','坤','康侯用錫馬蕃庶，晝日三接。','晉如摧如，貞吉。罔孚，裕无咎。|晉如愁如，貞吉。受茲介福，于其王母。|眾允，悔亡。|晉如鼫鼠，貞厲。|悔亡，失得勿恤，往吉无不利。|晉其角，維用伐邑，厲吉无咎，貞吝。','旭日上升，穩步晉升前進。'],
    [36,'明夷','地火明夷','坤','離','利艱貞。','明夷于飛，垂其翼。君子于行，三日不食。有攸往，主人有言。|明夷，夷于左股，用拯馬壯，吉。|明夷于南狩，得其大首，不可疾貞。|入于左腹，獲明夷之心，于出門庭。|箕子之明夷，利貞。|不明晦，初登于天，後入于地。','光明受傷，韜光養晦以待時。'],
    [37,'家人','風火家人','巽','離','利女貞。','閑有家，悔亡。|无攸遂，在中饋，貞吉。|家人嗃嗃，悔厲吉；婦子嘻嘻，終吝。|富家，大吉。|王假有家，勿恤，吉。|有孚威如，終吉。','家道正而後能安，各安其位。'],
    [38,'睽','火澤睽','離','兌','小事吉。','悔亡，喪馬勿逐，自復；見惡人，无咎。|遇主于巷，无咎。|見輿曳，其牛掣，其人天且劓，无初有終。|睽孤，遇元夫，交孚，厲无咎。|悔亡，厥宗噬膚，往何咎。|睽孤，見豕負塗，載鬼一車，先張之弧，後說之弧，匪寇婚媾，往遇雨則吉。','意見相左，先在小處求同。'],
    [39,'蹇','水山蹇','坎','艮','利西南，不利東北；利見大人，貞吉。','往蹇，來譽。|王臣蹇蹇，匪躬之故。|往蹇來反。|往蹇來連。|大蹇朋來。|往蹇來碩，吉；利見大人。','前路艱難，反身修德、尋求助力。'],
    [40,'解','雷水解','震','坎','利西南，无所往，其來復吉。有攸往，夙吉。','无咎。|田獲三狐，得黃矢，貞吉。|負且乘，致寇至，貞吝。|解而拇，朋至斯孚。|君子維有解，吉；有孚于小人。|公用射隼于高墉之上，獲之，无不利。','困難緩解，及早行動、寬以待人。'],
    [41,'損','山澤損','艮','兌','有孚，元吉，无咎，可貞，利有攸往。曷之用？二簋可用享。','已事遄往，无咎，酌損之。|利貞，征凶，弗損益之。|三人行則損一人，一人行則得其友。|損其疾，使遄有喜，无咎。|或益之十朋之龜，弗克違，元吉。|弗損益之，无咎，貞吉，利有攸往，得臣无家。','減損己欲，有捨才有得。'],
    [42,'益','風雷益','巽','震','利有攸往，利涉大川。','利用為大作，元吉，无咎。|或益之十朋之龜，弗克違，永貞吉。王用享于帝，吉。|益之用凶事，无咎。有孚中行，告公用圭。|中行，告公從，利用為依遷國。|有孚惠心，勿問元吉。有孚惠我德。|莫益之，或擊之，立心勿恆，凶。','把握增益之機，積極作為、利人利己。'],
    [43,'夬','澤天夬','兌','乾','揚于王庭，孚號有厲。告自邑，不利即戎，利有攸往。','壯于前趾，往不勝為咎。|惕號，莫夜有戎，勿恤。|壯于頄，有凶。君子夬夬，獨行遇雨，若濡有慍，无咎。|臀无膚，其行次且。牽羊悔亡，聞言不信。|莧陸夬夬，中行无咎。|无號，終有凶。','果決斷除，但須講理而不莽撞。'],
    [44,'姤','天風姤','乾','巽','女壯，勿用取女。','繫于金柅，貞吉。有攸往，見凶，羸豕孚蹢躅。|包有魚，无咎，不利賓。|臀无膚，其行次且，厲，无大咎。|包无魚，起凶。|以杞包瓜，含章，有隕自天。|姤其角，吝，无咎。','不期而遇，對突來的誘惑保持警覺。'],
    [45,'萃','澤地萃','兌','坤','亨。王假有廟，利見大人，亨，利貞。用大牲吉，利有攸往。','有孚不終，乃亂乃萃，若號，一握為笑，勿恤，往无咎。|引吉，无咎，孚乃利用禴。|萃如嗟如，无攸利，往无咎，小吝。|大吉，无咎。|萃有位，无咎。匪孚，元永貞，悔亡。|齎咨涕洟，无咎。','人才聚集，凝聚共識與向心力。'],
    [46,'升','地風升','坤','巽','元亨，用見大人，勿恤，南征吉。','允升，大吉。|孚乃利用禴，无咎。|升虛邑。|王用亨于岐山，吉无咎。|貞吉，升階。|冥升，利于不息之貞。','循序上升，積小成大。'],
    [47,'困','澤水困','兌','坎','亨，貞，大人吉，无咎。有言不信。','臀困于株木，入于幽谷，三歲不覿。|困于酒食，朱紱方來，利用亨祀，征凶，无咎。|困于石，據于蒺藜，入于其宮，不見其妻，凶。|來徐徐，困于金車，吝，有終。|劓刖，困于赤紱，乃徐有說，利用祭祀。|困于葛藟，于臲卼，曰動悔有悔，征吉。','身處困境，少說多做，信念不墜。'],
    [48,'井','水風井','坎','巽','改邑不改井，无喪无得，往來井井。汔至，亦未繘井，羸其瓶，凶。','井泥不食，舊井无禽。|井谷射鮒，甕敝漏。|井渫不食，為我心惻，可用汲，王明，並受其福。|井甃，无咎。|井冽，寒泉食。|井收勿幕，有孚元吉。','如井養人不窮，修身以利他。'],
    [49,'革','澤火革','兌','離','巳日乃孚，元亨利貞，悔亡。','鞏用黃牛之革。|巳日乃革之，征吉，无咎。|征凶，貞厲，革言三就，有孚。|悔亡，有孚改命，吉。|大人虎變，未占有孚。|君子豹變，小人革面，征凶，居貞吉。','變革之時：時機成熟、取信於人後再行動。'],
    [50,'鼎','火風鼎','離','巽','元吉，亨。','鼎顛趾，利出否，得妾以其子，无咎。|鼎有實，我仇有疾，不我能即，吉。|鼎耳革，其行塞，雉膏不食，方雨虧悔，終吉。|鼎折足，覆公餗，其形渥，凶。|鼎黃耳金鉉，利貞。|鼎玉鉉，大吉，无不利。','鼎新立業，穩固制度與人才。'],
    [51,'震','震為雷','震','震','亨。震來虩虩，笑言啞啞。震驚百里，不喪匕鬯。','震來虩虩，後笑言啞啞，吉。|震來厲，億喪貝，躋于九陵，勿逐，七日得。|震蘇蘇，震行无眚。|震遂泥。|震往來厲，億无喪，有事。|震索索，視矍矍，征凶。震不于其躬，于其鄰，无咎。婚媾有言。','驚雷乍響，恐懼修省，臨危不亂。'],
    [52,'艮','艮為山','艮','艮','艮其背，不獲其身，行其庭，不見其人，无咎。','艮其趾，无咎，利永貞。|艮其腓，不拯其隨，其心不快。|艮其限，列其夤，厲薰心。|艮其身，无咎。|艮其輔，言有序，悔亡。|敦艮，吉。','適可而止，止於所當止。'],
    [53,'漸','風山漸','巽','艮','女歸吉，利貞。','鴻漸于干，小子厲，有言，无咎。|鴻漸于磐，飲食衎衎，吉。|鴻漸于陸，夫征不復，婦孕不育，凶；利禦寇。|鴻漸于木，或得其桷，无咎。|鴻漸于陵，婦三歲不孕，終莫之勝，吉。|鴻漸于陸，其羽可用為儀，吉。','循序漸進，不急不躁。'],
    [54,'歸妹','雷澤歸妹','震','兌','征凶，无攸利。','歸妹以娣，跛能履，征吉。|眇能視，利幽人之貞。|歸妹以須，反歸以娣。|歸妹愆期，遲歸有時。|帝乙歸妹，其君之袂，不如其娣之袂良，月幾望，吉。|女承筐无實，士刲羊无血，无攸利。','名分不正則難長久，留意自己在關係中的位置。'],
    [55,'豐','雷火豐','震','離','亨，王假之，勿憂，宜日中。','遇其配主，雖旬无咎，往有尚。|豐其蔀，日中見斗，往得疑疾，有孚發若，吉。|豐其沛，日中見沬，折其右肱，无咎。|豐其蔀，日中見斗，遇其夷主，吉。|來章，有慶譽，吉。|豐其屋，蔀其家，闚其戶，闃其无人，三歲不覿，凶。','盛大豐滿；如日中天時，更要顧及消長。'],
    [56,'旅','火山旅','離','艮','小亨，旅貞吉。','旅瑣瑣，斯其所取災。|旅即次，懷其資，得童僕貞。|旅焚其次，喪其童僕，貞厲。|旅于處，得其資斧，我心不快。|射雉一矢亡，終以譽命。|鳥焚其巢，旅人先笑後號咷。喪牛于易，凶。','羈旅在外，謙和謹慎、守正自處。'],
    [57,'巽','巽為風','巽','巽','小亨，利有攸往，利見大人。','進退，利武人之貞。|巽在床下，用史巫紛若，吉无咎。|頻巽，吝。|悔亡，田獲三品。|貞吉悔亡，无不利。无初有終，先庚三日，後庚三日，吉。|巽在床下，喪其資斧，貞凶。','柔順而入，細水長流地影響。'],
    [58,'兌','兌為澤','兌','兌','亨，利貞。','和兌，吉。|孚兌，吉，悔亡。|來兌，凶。|商兌未寧，介疾有喜。|孚于剝，有厲。|引兌。','和悅溝通，以誠相待。'],
    [59,'渙','風水渙','巽','坎','亨。王假有廟，利涉大川，利貞。','用拯馬壯，吉。|渙奔其机，悔亡。|渙其躬，无悔。|渙其群，元吉。渙有丘，匪夷所思。|渙汗其大號，渙王居，无咎。|渙其血，去逖出，无咎。','渙散離析之時，重新凝聚人心。'],
    [60,'節','水澤節','坎','兌','亨。苦節不可貞。','不出戶庭，无咎。|不出門庭，凶。|不節若，則嗟若，无咎。|安節，亨。|甘節，吉，往有尚。|苦節，貞凶，悔亡。','節制有度，但不可苦節。'],
    [61,'中孚','風澤中孚','巽','兌','豚魚吉，利涉大川，利貞。','虞吉，有它不燕。|鳴鶴在陰，其子和之，我有好爵，吾與爾靡之。|得敵，或鼓或罷，或泣或歌。|月幾望，馬匹亡，无咎。|有孚攣如，无咎。|翰音登于天，貞凶。','誠信於中，可以感化人心。'],
    [62,'小過','雷山小過','震','艮','亨，利貞，可小事，不可大事。飛鳥遺之音，不宜上宜下，大吉。','飛鳥以凶。|過其祖，遇其妣；不及其君，遇其臣；无咎。|弗過防之，從或戕之，凶。|无咎，弗過遇之，往厲必戒，勿用永貞。|密雲不雨，自我西郊，公弋取彼在穴。|弗遇過之，飛鳥離之，凶，是謂災眚。','小事可為、大事宜緩，宜低調。'],
    [63,'既濟','水火既濟','坎','離','亨小，利貞，初吉終亂。','曳其輪，濡其尾，无咎。|婦喪其茀，勿逐，七日得。|高宗伐鬼方，三年克之，小人勿用。|繻有衣袽，終日戒。|東鄰殺牛，不如西鄰之禴祭，實受其福。|濡其首，厲。','事已成，慎其終，防盛極而亂。'],
    [64,'未濟','火水未濟','離','坎','亨，小狐汔濟，濡其尾，无攸利。','濡其尾，吝。|曳其輪，貞吉。|未濟，征凶，利涉大川。|貞吉，悔亡，震用伐鬼方，三年有賞于大國。|貞吉，无悔，君子之光，有孚，吉。|有孚于飲酒，无咎，濡其首，有孚失是。','尚未完成，充滿可能，審慎前行。'],
  ];

  const POS = ['初','二','三','四','五','上'];
  function lineLabel(i, yang) {
    const n = yang ? '九' : '六';
    if (i === 0) return '初' + n;
    if (i === 5) return '上' + n;
    return n + POS[i];
  }

  const HEX = RAW.map(r => {
    const [num, name, full, upper, lower, judge, lines, plain, extra] = r;
    const bits = TRI[lower].bits.concat(TRI[upper].bits);
    return {
      num, name, full, upper, lower, judge, plain, extra: extra || null, bits,
      key: bits.join(''),
      lines: lines.split('|').map((t, i) => ({ label: lineLabel(i, bits[i]), text: t })),
    };
  });
  const BY_KEY = {}; HEX.forEach(h => { BY_KEY[h.key] = h; });
  const byBits = bits => BY_KEY[bits.join('')];
  const byTri = (lower, upper) => byBits(TRI[lower].bits.concat(TRI[upper].bits));
  const triByXian = n => TRI_ORDER[((n - 1) % 8 + 8) % 8];
  const triOfBits = b => TRI_ORDER.find(k => TRI[k].bits.join('') === b.join(''));

  return { TRI, TRI_ORDER, HOU_ORDER, HEX, byBits, byTri, triByXian, triOfBits, lineLabel };
})();

      const rl = left % 4 || 4, rr = right % 4 || 4; // 揲之以四，歸奇於扐
      const removed = 1 + rl + rr;
      steps.push({ left, right: right + 1, removed });
      total -= removed;
    }
    const v = total / 4; // 6,7,8,9
    return { v, steps };
  }
  // 三枚銅錢：字(陽)=3，背(陰)=2
  function coinLine() {

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // deck-stage enables its rail in connectedCallback, but this panel can
  // mount before that element has upgraded. The initial read catches the
  // common case; the listener covers mounting first. (Older deck-stage.js
  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>

  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}

// Typewriter-cycles through `suggestions`. Clicking the field while a
// suggestion is animating freezes it as ghost text; Tab accepts it into the
// input. Enter posts __edit_mode_chat (host drops the text into the chat
// composer for the user to send). After the cycle the static placeholder
// types in and "Ideas" appears — clicking asks for three more suggestions.
function TweakSuggestionBar({
  suggestions = [],
  placeholder = 'Describe a tweak…',
  ideasPrompt = 'Suggest three more tweak ideas for this design and update the suggestions on TweakSuggestionBar.',
}) {
  const [val, setVal] = React.useState('');
  const [ghost, setGhost] = React.useState('');
  const [focused, setFocused] = React.useState(false);
  const inputRef = React.useRef(null);
  const tw = useTwkTypewriter(suggestions, { placeholder, enabled: !val && !ghost && !focused });

  const freeze = () => {
    tw.markPlayed();
    if (val || ghost) return;
    const target = !tw.done ? suggestions[tw.idx] : '';
    if (target) setGhost(target);
    inputRef.current?.focus();
  };

  const submit = () => {
    const v = (val || ghost).trim();
    if (!v) return;
    __twkSendChat(v);
    setVal('');
    setGhost('');
  };

  const onKeyDown = (e) => {
    if (e.key === 'Tab' && ghost && !val) {
      e.preventDefault();
      setVal(ghost);
      setGhost('');
    } else if (e.key === 'Enter') {
      e.preventDefault();
      submit();
    } else if (e.key === 'Escape') {
      setGhost('');
    }
  };

  const requestIdeas = () => __twkSendChat(ideasPrompt);

  const showAnim = !val && !ghost && !focused && !tw.done;
  const showStatic = !val && !ghost && !focused && tw.done;

  return (
    <div className="twk-sugg" onMouseDown={freeze}>
      <div className="twk-sugg-field">
        <input
          ref={inputRef}
          value={val}
          placeholder={focused && !ghost ? placeholder : ''}
          onChange={(e) => { setVal(e.target.value); setGhost(''); }}
          onFocus={() => { setFocused(true); tw.markPlayed(); }}
          onBlur={() => { setFocused(false); if (!val) setGhost(''); }}
          onKeyDown={onKeyDown}
        />
        {showAnim && (
          <div className="twk-sugg-ghost">
            {tw.text}<span className="twk-sugg-caret" />
          </div>
        )}
        {showStatic && (
          <div className="twk-sugg-ghost">
            {tw.tail}{tw.tail.length < placeholder.length && <span className="twk-sugg-caret" />}
          </div>
        )}
        {ghost && !val && (
          <div className="twk-sugg-ghost hint">{ghost}</div>
        )}
      </div>
      {val || ghost ? (
        <button className="twk-sugg-send"
                onMouseDown={(e) => { e.stopPropagation(); e.preventDefault(); }}
                onClick={submit}>
          Add
        </button>
      ) : tw.done && !focused ? (
        <button className="twk-sugg-ideas"
                onMouseDown={(e) => { e.stopPropagation(); e.preventDefault(); }}
                onClick={requestIdeas}>
          Ideas <__TwkSpark />
        </button>
      ) : null}
    </div>
  );
}

// Minimal type→pause→erase cycler. Plays once per unique `items` content per
// session — a reload from a tweak-value write skips straight to done; a new
// suggestion set (after "Ideas") gets a fresh animation.
function useTwkTypewriter(items, { placeholder, typeMs = 35, eraseMs = 22, pauseMs = 1800, enabled = true } = {}) {
  // Dep mirrors the memo body verbatim so collidable joins like
  // ['a\nb','c'] vs ['a','b','c'] don't share a stale sessionStorage key
  // (gen-spark PR #28600 Bugbot R3 — minor divergence from Tiffany's
  // `items.join('\n')` dep; upstream report pending).
  const key = React.useMemo(() => '__twk_played:' + JSON.stringify(items), [JSON.stringify(items)]);
  const played = () => { try { return sessionStorage.getItem(key) === '1'; } catch { return false; } };

  const [text, setText] = React.useState('');
  const [tail, setTail] = React.useState(() => (items.length === 0 || played() ? placeholder : ''));
  const [idx, setIdx] = React.useState(0);
  const [done, setDone] = React.useState(() => items.length === 0 || played());
  const phase = React.useRef('type');
  const n = React.useRef(0);

  const markPlayed = React.useCallback(() => {
    try { sessionStorage.setItem(key, '1'); } catch {}
    setDone(true);
  }, [key]);

  React.useEffect(() => {
    const skip = items.length === 0 || played();
    setText(''); setIdx(0);
    setDone(skip);
    setTail(skip ? placeholder : '');
    phase.current = 'type'; n.current = 0;
  }, [key]);

  React.useEffect(() => {
    if (done || !enabled) return;
    const item = items[idx] ?? '';
    let t;
    const tick = () => {
      if (phase.current === 'type') {
        n.current++;
        setText(item.slice(0, n.current));
        if (n.current >= item.length) { phase.current = 'pause'; t = setTimeout(tick, pauseMs); }
        else t = setTimeout(tick, typeMs + Math.random() * 20);
      } else if (phase.current === 'pause') {
        phase.current = 'erase'; t = setTimeout(tick, eraseMs);
      } else {
        n.current--;
        setText(item.slice(0, n.current));
        if (n.current <= 0) {
          if (idx === items.length - 1) { markPlayed(); return; }
          phase.current = 'type'; setIdx((i) => i + 1);
        } else t = setTimeout(tick, eraseMs);
      }
    };
    phase.current = 'type'; n.current = 0; setText('');
    t = setTimeout(tick, 400);
    return () => clearTimeout(t);
  }, [idx, done, key, enabled, typeMs, eraseMs, pauseMs]);

  React.useEffect(() => {
    if (!done || tail === placeholder) return;
    let i = 0;
    const t = setInterval(() => {
      i++; setTail(placeholder.slice(0, i));
      if (i >= placeholder.length) clearInterval(t);
    }, 28);
    return () => clearInterval(t);
  }, [done, placeholder]);

  return { text, tail, idx, done, markPlayed };
}

function mdInline(s) {
  s = s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  return s;
}
function mdToHtml(src) {
  const lines = (src || '').replace(/\r/g, '').split('\n');
  let out = '', list = null, para = [], quote = [], pre = null;
  const flushP = () => { if (para.length) { out += '<p>' + para.map(mdInline).join('<br/>') + '</p>'; para = []; } };
  const flushL = () => { if (list) { out += `<${list.t}>` + list.items.map(i => '<li>' + mdInline(i) + '</li>').join('') + `</${list.t}>`; list = null; } };
  const flushQ = () => { if (quote.length) { out += '<blockquote><p>' + quote.map(mdInline).join('<br/>') + '</p></blockquote>'; quote = []; } };
  const flush = () => { flushP(); flushL(); flushQ(); };
  for (const raw of lines) {
    if (pre !== null) { if (/^```/.test(raw)) { out += '<pre>' + pre.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</pre>'; pre = null; } else pre += raw + '\n'; continue; }
    const l = raw.trimEnd();
    if (/^```/.test(l)) { flush(); pre = ''; continue; }
    let m;
    if (!l.trim()) { flush(); continue; }
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { flush(); const n = Math.min(4, Math.max(2, m[1].length)); out += `<h${n}>${mdInline(m[2])}</h${n}>`; continue; }
    if (/^(-{3,}|\*{3,})$/.test(l.trim())) { flush(); out += '<hr/>'; continue; }
    if ((m = l.match(/^>\s?(.*)/))) { flushP(); flushL(); quote.push(m[1]); continue; }
    if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { flushP(); flushQ(); if (!list || list.t !== 'ul') { flushL(); list = { t: 'ul', items: [] }; } list.items.push(m[1]); continue; }
    if ((m = l.match(/^\s*\d+[.)、]\s+(.*)/))) { flushP(); flushQ(); if (!list || list.t !== 'ol') { flushL(); list = { t: 'ol', items: [] }; } list.items.push(m[1]); continue; }
    flushL(); flushQ(); para.push(l);
  }
  if (pre !== null) out += '<pre>' + pre + '</pre>';
  flush();
  return out;
}

      <div className="drawer-body">{children}</div>

<script type="text/babel">var { useState, useEffect, useRef, useMemo, useCallback } = React;
// 有疑才問 — 六種起卦互動（v2：動畫精緻化）
var E = window.ENGINE, Y = window.YI;
const POSN = ['初爻', '二爻', '三爻', '四爻', '五爻', '上爻'];
const VNAME = { 6: '老陰 ×', 7: '少陽', 8: '少陰', 9: '老陽 ○' };
const SYM8 = { 乾: '☰', 兌: '☱', 離: '☲', 震: '☳', 巽: '☴', 坎: '☵', 艮: '☶', 坤: '☷' };
const sleep = ms => new Promise(r => setTimeout(r, ms));
function useAlive() { const r = useRef(true); useEffect(() => () => { r.current = false; }, []); return r; }
function useWidth(ref, fallback = 560) {
  const [w, setW] = useState(fallback);
  useEffect(() => {
    if (!ref.current) return;
    const ro = new ResizeObserver(es => setW(es[0].contentRect.width));
    ro.observe(ref.current); return () => ro.disconnect();
  }, []);
  return w;
}

function Builder({ values, title = '卦象生成中', note, active }) {
  return (
    <div className="stage-side">
      <h4>{title}</h4>
      <div className="building">
        {[0, 1, 2, 3, 4, 5].map(i => (
          <div key={i} className={'build-row' + (values[i] == null ? ' empty' : '') + (active === i ? ' cur' : '')}>
            <span>{POSN[i]}</span>
            <YaoSlot v={values[i]} />
            <span className="mono" style={{ textAlign: 'right', fontSize: 11, color: values[i] === 6 || values[i] === 9 ? 'var(--accent)' : undefined }}>{values[i] ? VNAME[values[i]] : ''}</span>
          </div>
        ))}
      </div>
      <div className="hint" style={{ marginTop: 'auto' }}>{note || '由下而上，初爻至上爻。赭色為變爻。'}</div>
    </div>
  );
}

// =====================================================================
// 三錢搖卦：雙手搖動 → 拋起 → 3D 翻轉落地彈跳
// =====================================================================
function Coin3D({ angle, flying, delay, dur, shaking, face }) {
  return (
    <div className="coin-slot">
      <div className={'coin-shadow' + (flying ? ' go' : '')} style={{ animationDelay: delay + 's', animationDuration: dur + 's' }} />
      <div className={'coin-fly' + (flying ? ' go' : '') + (shaking ? ' rattle' : '')} style={{ animationDelay: flying ? delay + 's' : '0s', animationDuration: flying ? dur + 's' : undefined }}>
        <div className="coin3d" style={{ transform: `rotateX(${angle}deg)`, transitionDuration: dur + 's', transitionDelay: delay + 's' }}>
          <div className="cface front"><div className="coin-chars"><span>乾</span><span>通</span><span>寶</span><span>元</span></div><div className="coin-hole" /></div>
          <div className="cmid" />
          <div className="cface back"><div className="coin-ring" /><div className="coin-hole" /></div>
        </div>
      </div>
