}
function CoinMethod({ onDone }) {
  const alive = useAlive();
  const [vals, setVals] = useState([]);
  const [angles, setAngles] = useState([0, 0, 0]);
  const [faces, setFaces] = useState([null, null, null]);
  const [phase, setPhase] = useState('idle'); // idle | shake | fly
  const [tossN, setTossN] = useState(0);
  const [last, setLast] = useState(null);
  const durs = useMemo(() => [1.35, 1.5, 1.42], []);
  const delays = [0, 0.07, 0.13];
  const valsRef = useRef([]);

  const tossOnce = async (fast) => {
    const r = E.coinLine();
    setPhase('shake'); setFaces([null, null, null]); setLast(null);
    await sleep(fast ? 280 : 620); if (!alive.current) return;
    setTossN(n => n + 1); setPhase('fly');
    setAngles(a => a.map((ang, i) => {
      const yang = r.coins[i] === 3;
      const base = Math.ceil((ang + 1) / 360) * 360 + 360 * (3 + i); // 多轉幾圈
      return base + (yang ? 0 : 180);
    }));
    await sleep((Math.max(...durs) + 0.15) * 1000); if (!alive.current) return;
    setFaces(r.coins.map(c => c === 3)); setPhase('idle'); setLast(r.v);
    valsRef.current = [...valsRef.current, r.v]; setVals(valsRef.current);
    if (valsRef.current.length === 6) { await sleep(1000); alive.current && onDone(valsRef.current, { detail: '三錢六擲' }); }
  };
  const busy = phase !== 'idle';
  const toss = () => { if (!busy && vals.length < 6) tossOnce(false); };
  const auto = async () => { while (alive.current && valsRef.current.length < 6) { await tossOnce(true); await sleep(380); } };
  const sum = faces.every(f => f != null) ? faces.reduce((a, f) => a + (f ? 3 : 2), 0) : null;

  return (
    <div className="stage">
      <div className="stage-main">
        <div className="coin-table">
          {[0, 1, 2].map(i => <Coin3D key={i} angle={angles[i]} flying={phase === 'fly'} shaking={phase === 'shake'} delay={delays[i]} dur={durs[i]} face={faces[i]} k={tossN} />)}
          <div className="table-line" />
        </div>
        <div className="toss-result">
          {sum != null ? <><span className="mono">{faces.map(f => (f ? 3 : 2)).join(' + ')} = {sum}</span><b className="kai">{{ 6: '老陰 · 變', 7: '少陽', 8: '少陰', 9: '老陽 · 變' }[sum]}</b></>
            : <span className="instr">{phase === 'shake' ? '搖……' : phase === 'fly' ? '　' : vals.length < 6 ? <>雙手合握銅錢，心想所問，擲出第 <b className="accent">{vals.length + 1}</b> 次（共 6 次）</> : '六爻已成'}</span>}
        </div>
        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', justifyContent: 'center' }}>
          <button className="btn primary" onClick={toss} disabled={busy || vals.length >= 6}>{vals.length < 6 ? `擲錢 · ${POSN[vals.length]}` : '已成卦'}</button>
          {vals.length < 5 && <button className="btn ghost sm" onClick={auto} disabled={busy}>自動擲完</button>}
        </div>
      </div>
      <Builder values={vals} active={vals.length < 6 ? vals.length : null} note="三字 = 老陽 9（變）；三背 = 老陰 6（變）；一字二背 = 少陽 7；二字一背 = 少陰 8。" />
    </div>
  );
}

// =====================================================================
// 大衍蓍草：四十九策在桌面上「分二、掛一、揲四、歸奇」實際演算
// =====================================================================
function YarrowMethod({ onDone }) {
  const alive = useAlive();
  const tableRef = useRef(null);
  const W = useWidth(tableRef, 600);
  const st = useRef(Array(49).fill('pool')); // pool | left | right | hang | rem | out
  const side = useRef(Array(49).fill(''));
  const [, force] = useState(0);
  const render = () => force(x => x + 1);
  const [counting, setCounting] = useState(false);
  const [vals, setVals] = useState([]);
  const [busy, setBusy] = useState(false);
  const [log, setLog] = useState([]);
  const [caption, setCaption] = useState('取蓍五十，虛一不用。以四十九策，默念所問。');
  const [fastMode, setFastMode] = useState(false);
  const valsRef = useRef([]);

  const runLine = async (fast) => {
    const T = ms => sleep(ms * (fast ? 0.42 : 1));
    st.current = Array(49).fill('pool'); render(); setLog([]);
    await T(400);
    let total = 49;
    for (let k = 0; k < 3; k++) {
      if (!alive.current) return;
      const act = st.current.map((s, i) => (s === 'pool' ? i : -1)).filter(i => i >= 0);
      const L = 1 + E.rnd(total - 2);
      setCaption(`第 ${k + 1} 變 · 分而為二，以象兩儀`);
      act.forEach((id, j) => { st.current[id] = j < L ? 'left' : 'right'; side.current[id] = j < L ? 'L' : 'R'; }); render(); await T(800);
      const rightIds = act.slice(L);
      st.current[rightIds[rightIds.length - 1]] = 'hang'; render();
      setCaption('掛一，以象三才'); await T(650);
      setCounting(true); setCaption('揲之以四，以象四時'); await T(900);
      const leftIds = act.slice(0, L), rIds = rightIds.slice(0, -1);
      const rl = leftIds.length % 4 || 4, rr = rIds.length % 4 || 4;
      leftIds.slice(-rl).forEach(id => { st.current[id] = 'rem'; });
      rIds.slice(-rr).forEach(id => { st.current[id] = 'rem'; });
      render(); setCaption(`歸奇於扐：左餘 ${rl}、右餘 ${rr}，加掛一 1`); await T(900);
      const removed = 1 + rl + rr;
      st.current = st.current.map(s => (s === 'rem' || s === 'hang' ? 'out' : s === 'left' || s === 'right' ? 'pool' : s));
      setCounting(false); render();
      total -= removed;
      setLog(l => [...l, { k, left: L, right: total + removed - L, removed, total }]);
      await T(700);
    }
    const v = total / 4;
    setCaption(`三變後餘 ${total} 策，÷ 4 = ${v} → ${VNAME[v]}`);
    valsRef.current = [...valsRef.current, v]; setVals(valsRef.current);
    await T(900);
  };
  const run = async (fast) => {
    if (busy || valsRef.current.length >= 6) return;
    setBusy(true); setFastMode(fast);
    do { await runLine(fast); } while (fast && alive.current && valsRef.current.length < 6);
    if (!alive.current) return;
    setBusy(false);
    if (valsRef.current.length === 6) { setCaption('十八變而成卦。'); await sleep(900); alive.current && onDone(valsRef.current, { detail: '十八變成卦' }); }
  };

  // ----- 位置計算 -----
  const narrow = W < 460;
  const H = 210, stickH = narrow ? 96 : 116, baseY = 46;
  const groups = { pool: [], left: [], right: [], rem: [], out: [] };
  st.current.forEach((s, i) => { if (groups[s]) groups[s].push(i); });
  const posOf = {};
  const row = (ids, cx, maxW, maxSp) => { const sp = Math.min(maxSp, maxW / Math.max(1, ids.length)); ids.forEach((id, j) => { posOf[id] = { x: cx + (j - (ids.length - 1) / 2) * sp, y: baseY }; }); };
  const lg2 = [], rg2 = [];
  st.current.forEach((s, i) => { if (s === 'left' || (s === 'rem' && side.current[i] === 'L')) lg2.push(i); else if (s === 'right' || (s === 'rem' && side.current[i] === 'R')) rg2.push(i); });
  row(groups.pool, W / 2, W - 60, narrow ? 7 : 10);
  row(lg2, W * 0.27, W * 0.42, narrow ? 4 : 7);
  row(rg2, W * 0.73, W * 0.42, narrow ? 4 : 7);
  const remSet = new Set(groups.rem);
  const groupIdx = id => { const arr = lg2.includes(id) ? lg2 : rg2; return arr.indexOf(id); };
  const outIds = groups.out;

  return (
    <div className="stage">
      <div className="stage-main">
        <div className="yarrow-table" ref={tableRef} style={{ height: H }}>
          <div className="taiji-stick" title="虛一不用"><i /><span>太極 · 虛一</span></div>
          <div className="yt-label l" style={{ opacity: lg2.length ? 1 : 0 }}>天 · 左手 {lg2.length}</div>
          <div className="yt-label r" style={{ opacity: rg2.length ? 1 : 0 }}>地 · 右手 {rg2.length}</div>
          <div className="yt-tray"><span className="mono">扐 {outIds.length}</span></div>
          {st.current.map((s, id) => {
            let tr, cls = 'ystick';
            if (s === 'hang') tr = `translate(${W / 2 - 1}px, ${baseY - 34}px) rotate(90deg) scale(.55)`;
            else if (s === 'out') { const j = outIds.indexOf(id); tr = `translate(${W - 34 - (j % 3) * 6}px, ${H - 38 - Math.floor(j / 3) * 3}px) rotate(90deg) scale(.22)`; cls += ' out'; }
            else { const p = posOf[id] || { x: W / 2, y: baseY }; const lift = s === 'rem' ? -16 : 0; tr = `translate(${p.x - 1}px, ${p.y + lift}px)`; }
            if (s === 'rem') cls += ' rem';
            else if (counting && (s === 'left' || s === 'right')) cls += Math.floor(groupIdx(id) / 4) % 2 ? ' g1' : ' g0';
            if (s === 'hang') cls += ' hang';
            return <div key={id} className={cls} style={{ transform: tr, height: stickH, width: narrow ? 2 : 3, transitionDuration: fastMode ? '.32s' : '.6s', transitionDelay: s === 'left' || s === 'right' ? (id % 12) * 6 + 'ms' : '0ms' }} />;
          })}
        </div>
        <div className="yarrow-caption kai">{caption}</div>
        <div className="changes">
          {log.map((s, i) => <div key={i} className="change">第{['一', '二', '三'][s.k]}變<b>{s.left} | {s.right} → 去 {s.removed}</b><span>餘 {s.total}</span></div>)}
        </div>
        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', justifyContent: 'center' }}>
          <button className="btn primary" onClick={() => run(false)} disabled={busy || vals.length >= 6}>{vals.length < 6 ? `分蓍 · 求${POSN[vals.length]}` : '已成卦'}</button>
          {vals.length < 6 && <button className="btn ghost sm" onClick={() => run(true)} disabled={busy}>連續演算剩餘 {6 - vals.length} 爻</button>}
        </div>
      </div>
      <Builder values={vals} active={vals.length < 6 ? vals.length : null} title={`已完成 ${vals.length * 3} / 18 變`} note="三變後所餘策數 ÷ 4，得 6、7、8、9。大衍法的老陽、老陰機率與銅錢不同，最貼近古法。" />
    </div>
  );
}

// =====================================================================
// 數字起卦：數字取餘 → 上下卦合成
// =====================================================================
function NumberMethod({ onDone, count }) {
  const alive = useAlive();
  const [nums, setNums] = useState(count === 3 ? ['', '', ''] : ['']);
  const [calc, setCalc] = useState(null);
  const [step, setStep] = useState(0);
  const valid = nums.every(n => /^\d{3}$/.test(n) && +n > 0);
  const labels = count === 3 ? ['上卦', '下卦', '動爻'] : ['三位數'];
  const go = async () => {
    const r = count === 3 ? E.threeNumbers(+nums[0], +nums[1], +nums[2]) : E.oneNumber(+nums[0]);
    setCalc(r);
    for (let s = 1; s <= 4; s++) { setStep(s); await sleep(650); if (!alive.current) return; }
    await sleep(700);
    alive.current && onDone(r.values, { detail: '數字 ' + nums.join(' · '), calc: r.calc });
  };
  const random = () => setNums(nums.map(() => String(100 + E.rnd(900))));
  const bits = calc ? calc.values.map(v => (v === 7 || v === 9 ? 1 : 0)) : null;
  const up = bits && Y.triOfBits(bits.slice(3)), lo = bits && Y.triOfBits(bits.slice(0, 3));
  const mv = calc ? calc.values.findIndex(v => v === 6 || v === 9) : -1;
  return (
    <div className="stage">
      <div className="stage-main">
        {!calc ? <>
          <div className="instr">閉眼片刻，讓第一個浮現的{count === 3 ? '三組' : '一組'}三位數出現，不必刻意挑選。</div>
          <div className="num-inputs">
            {nums.map((v, i) => (
              <div key={i} className="num-field">
                <input inputMode="numeric" maxLength={3} value={v} placeholder="000"
                  onChange={e => { const n = [...nums]; n[i] = e.target.value.replace(/\D/g, '').slice(0, 3); setNums(n); }}
                  onKeyDown={e => e.key === 'Enter' && valid && go()} />
                <label>{labels[i]}</label>
              </div>
            ))}
          </div>
          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', justifyContent: 'center' }}>
            <button className="btn primary" disabled={!valid} onClick={go}>生成卦象</button>
            <button className="btn ghost sm" onClick={random}>給我隨機數字</button>
          </div>
        </> : <div className="num-compose">
          <div className="nc-nums mono">{nums.join('  ·  ')}</div>
          <div className="nc-row">
            <div className={'nc-tri' + (step >= 1 ? ' on' : '')}><div className="lbl">上卦</div><div className="sym">{SYM8[up]}</div><div className="kai">{up}・{Y.TRI[up].nature}</div><div className="mono mute">{calc.calc[0].split('→')[0].replace('上卦：', '')}</div></div>
            <div className={'nc-plus' + (step >= 2 ? ' on' : '')}>＋</div>
            <div className={'nc-tri' + (step >= 2 ? ' on' : '')}><div className="lbl">下卦</div><div className="sym">{SYM8[lo]}</div><div className="kai">{lo}・{Y.TRI[lo].nature}</div><div className="mono mute">{calc.calc[1].split('→')[0].replace('下卦：', '')}</div></div>
            <div className={'nc-plus' + (step >= 3 ? ' on' : '')}>＝</div>
            <div className={'nc-hex' + (step >= 3 ? ' on' : '')}>
              {step >= 3 && <Hex bits={bits} moving={step >= 4 ? [mv] : []} w={86} h={9} gap={8} anim step={0.08} />}
              <div className="kai" style={{ marginTop: 10, fontSize: 20 }}>{step >= 3 ? Y.byBits(bits).name : ''}</div>
            </div>
          </div>
          <div className={'nc-move mono' + (step >= 4 ? ' on' : '')}>{calc.calc[2]}</div>
        </div>}
      </div>
      <Builder values={calc && step >= 4 ? calc.values : []} title="演算" note={count === 3 ? '以先天八卦數：乾1 兌2 離3 震4 巽5 坎6 艮7 坤8；餘 0 作 8。' : '一數起卦最為簡便，適合隨手檢視當下心境。'} />
    </div>
  );
}

// =====================================================================
// 易經卦卡：疊牌 → 鴿尾洗牌 ×2 → 扇形展開 → 抽牌翻面
// =====================================================================
function CardMethod({ onDone }) {
  const alive = useAlive();
  const deckRef = useRef(null);
  const W = useWidth(deckRef, 640);
  const narrow = W < 520;
  const N = narrow ? 9 : 13;
  const [phase, setPhase] = useState('stack'); // stack | split | fan | pick
  const [pick, setPick] = useState(null);
  const [deck, setDeck] = useState(() => { const a = Y.HEX.map(h => h.num); for (let i = a.length - 1; i > 0; i--) { const j = E.rnd(i + 1);[a[i], a[j]] = [a[j], a[i]]; } return a.slice(0, 13); });
  const [mov] = useState(() => E.rnd(6));
  const [busy, setBusy] = useState(false);
  const shuffle = async () => {
    setBusy(true);
    for (let r = 0; r < 3; r++) {
      setPhase('split'); await sleep(420); if (!alive.current) return;
      setDeck(d => { const a = [...d]; for (let i = a.length - 1; i > 0; i--) { const j = E.rnd(i + 1);[a[i], a[j]] = [a[j], a[i]]; } return a; });
      setPhase('stack'); await sleep(460); if (!alive.current) return;
    }
    setPhase('fan'); setBusy(false);
  };
  const choose = async i => {
    if (phase !== 'fan') return; setPick(i); setPhase('pick');
    const h = Y.HEX[deck[i] - 1];
    const vals = h.bits.map((b, k) => (k === mov ? (b ? 9 : 6) : (b ? 7 : 8)));
    await sleep(2600);
    alive.current && onDone(vals, { detail: '抽得第 ' + h.num + ' 卦卡' });
  };
  const cw = narrow ? 92 : 118, ch = narrow ? 142 : 182;
  const spread = narrow ? 8.5 : 6.4;
  const ph = Y.HEX[deck[pick ?? 0] - 1];
  return (
    <div className="stage" style={{ gridTemplateColumns: '1fr' }}>
      <div className="stage-main">
        <div className="deck2" ref={deckRef} style={{ height: ch + (narrow ? 110 : 120) }}>
          {deck.slice(0, N).map((num, i) => {
            const h = Y.HEX[num - 1];
            const off = i - (N - 1) / 2;
            let t, z = i, op = 1;
            if (phase === 'stack') t = `translate(${i * 0.5}px, ${-i * 0.6}px) rotate(${(i % 3 - 1) * 0.6}deg)`;
            if (phase === 'split') t = i % 2 ? `translate(${cw * 0.62}px, ${-i * 0.4}px) rotate(7deg)` : `translate(${-cw * 0.62}px, ${-i * 0.4}px) rotate(-7deg)`;
            if (phase === 'fan') t = `rotate(${off * spread}deg)`;
            if (phase === 'pick') {
              if (i === pick) { t = `translate(0, ${-ch * 0.05}px) rotate(0deg) scale(1.18)`; z = 50; }
              else { t = `rotate(${off * spread * 1.15}deg) translateY(${ch * 0.35}px)`; op = 0.18; }
            }
            return (
              <button key={num} className={'zc' + (phase === 'fan' ? ' pickable' : '') + (phase === 'pick' && i === pick ? ' flip' : '')}
                style={{ width: cw, height: ch, marginLeft: -cw / 2, transform: t, '--t': t, zIndex: z, opacity: op, transitionDelay: phase === 'fan' ? Math.abs(off) * 22 + 'ms' : phase === 'split' ? i * 14 + 'ms' : '0ms', transformOrigin: `50% ${phase === 'fan' || phase === 'pick' && i !== pick ? '230%' : '50%'}` }}
                onClick={() => choose(i)} disabled={phase !== 'fan'}>
                <div className="zc-in">
                  <div className="zc-b"><span className="seal">卦</span></div>
                  <div className="zc-f">
                    <div className="no mono">{String(h.num).padStart(2, '0')}</div>
                    <Hex bits={h.bits} moving={[mov]} w={narrow ? 44 : 58} h={narrow ? 4 : 5} gap={narrow ? 4 : 5} />
                    <div className="nm">{h.name}</div>
                    <div className="fl mono">{h.full}</div>
                  </div>
                </div>
              </button>
            );
          })}
        </div>
        <div className="instr" style={{ minHeight: 52 }}>
          {phase === 'pick' ? <span className="reveal-txt"><b className="kai">{ph.full}</b><br />「{ph.judge.length > 26 ? ph.judge.slice(0, 26) + '…' : ph.judge}」</span>
            : busy ? '洗牌中……讓心與牌一起安定。' : phase === 'fan' ? '憑直覺，選一張最吸引你的牌。' : '六十四卦卡已在手中。先洗牌。'}
        </div>
        {phase === 'stack' && !busy && <button className="btn primary" onClick={shuffle}>洗牌</button>}
      </div>
    </div>
  );
}

// =====================================================================
// 八面骰法：3D 立方骰（動爻）＋ 旋轉八面骰（上下卦）
// =====================================================================
const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
const FACE_ROT = { 1: [0, 0], 2: [0, -90], 6: [0, -180], 5: [0, 90], 3: [-90, 0], 4: [90, 0] };
function Cube({ n, spin }) {
  const [rx, ry] = FACE_ROT[n || 1];
  const faces = [[1, 'rotateY(0deg)'], [2, 'rotateY(90deg)'], [6, 'rotateY(180deg)'], [5, 'rotateY(-90deg)'], [3, 'rotateX(90deg)'], [4, 'rotateX(-90deg)']];
  return (
    <div className="cube-wrap"><div className="cube" style={{ transform: `rotateX(${rx + 720 * spin - 18}deg) rotateY(${ry + 1080 * spin + 22}deg)` }}>
      {faces.map(([f, r]) => <div key={f} className="cube-f" style={{ transform: `${r} translateZ(40px)` }}>{Array.from({ length: 9 }, (_, i) => <i key={i} className={PIPS[f].includes(i) ? (f === 1 ? 'p red' : 'p') : ''} />)}</div>)}
    </div></div>
  );
}
function Octa({ n, rolling, spin }) {
  const tri = n ? Y.triByXian(n) : null;
  return (
    <div className="octa-wrap"><div className={'octa' + (rolling ? ' rolling' : '')} style={{ '--spin': spin * 720 + 'deg' }}>
      <div className="octa-top" /><div className="octa-bot" />
      <div className="octa-val"><b className="mono">{n ?? '?'}</b>{tri && !rolling && <small className="kai">{SYM8[tri]} {tri}</small>}</div>
    </div></div>
  );
}
function DiceMethod({ onDone }) {
  const alive = useAlive();
  const [vals, setVals] = useState(null);
  const [rolling, setRolling] = useState(false);
  const [spin, setSpin] = useState(0);
  const [res, setRes] = useState([null, null, null]);
  const [flick, setFlick] = useState([null, null]);
  useEffect(() => {
    if (!rolling) return;
    const iv = setInterval(() => setFlick([1 + E.rnd(8), 1 + E.rnd(8)]), 70);
    return () => clearInterval(iv);
  }, [rolling]);
  const roll = async () => {
    const u = 1 + E.rnd(8), l = 1 + E.rnd(8), m = 1 + E.rnd(6);
    setRolling(true); setSpin(s => s + 1); setRes([null, null, m]);
    await sleep(1500); if (!alive.current) return;
    setRolling(false); setRes([u, l, m]);
    const v = E.fromTrigrams(u, l, m); setVals(v);
    await sleep(1500);
    alive.current && onDone(v, { detail: `骰得 ${u}・${l}・${m}` });
  };
  const caps = ['上卦 · 八面', '下卦 · 八面', '動爻 · 六面'];
  return (
    <div className="stage">
      <div className="stage-main">
        <div className={'dice2' + (rolling ? ' rolling' : '')}>
          {[0, 1].map(i => <div key={i} className="die2" style={{ animationDelay: i * .08 + 's' }}><Octa n={rolling ? flick[i] : res[i]} rolling={rolling} spin={spin} /><div className="die-shadow" /><div className="cap">{caps[i]}</div></div>)}
          <div className="die2" style={{ animationDelay: '.16s' }}><Cube n={res[2]} spin={spin} /><div className="die-shadow" /><div className="cap">{caps[2]}{res[2] && !rolling ? ` → ${POSN[res[2] - 1]}` : ''}</div></div>
        </div>
        <div className="instr">兩顆八面骰決定上、下卦（先天數：乾1 兌2 離3 震4 巽5 坎6 艮7 坤8），一顆六面骰決定哪一爻發生變化。</div>
        <button className="btn primary" onClick={roll} disabled={rolling || !!vals}>擲骰</button>
      </div>
      <Builder values={vals || []} title="卦象" />
    </div>
  );
}

function MethodStage({ method, onDone }) {
  if (method === 'coin') return <CoinMethod onDone={onDone} />;
  if (method === 'yarrow') return <YarrowMethod onDone={onDone} />;
  if (method === 'three') return <NumberMethod count={3} onDone={onDone} />;
  if (method === 'one') return <NumberMethod count={1} onDone={onDone} />;
  if (method === 'card') return <CardMethod onDone={onDone} />;
  if (method === 'dice') return <DiceMethod onDone={onDone} />;
  return null;
}

Object.assign(window, { MethodStage });

<script type="text/babel">var { useState, useEffect, useRef, useMemo, useCallback } = React;

        <div className="panel">
          <h4><span>本卦六爻</span><span>當位 / 應</span></h4>

              return (

        {loading ? <div style={{ maxWidth: 760 }}><div className="hint" style={{ marginBottom: 12 }}>正在請 Gemini 細讀卦象……</div>{[90, 70, 84, 60, 76].map((w, i) => <div key={i} className="shimmer" style={{ width: w + '%' }} />)}</div>

          <h4 className="kai">直接問 Gemini</h4>

        </div>

        </div>
        {showPrompt && <div className="askai-prompt"><pre>{E.buildChatPrompt(rec)}</pre>

<script type="text/babel">var { useState, useEffect, useRef, useMemo, useCallback } = React;
// 有疑才問 — 首頁＋占卜儀式流程（單頁逐步捲動）
function scrollToId(id) {
  setTimeout(() => {
    const el = document.getElementById(id); if (!el) return;
    const y = el.getBoundingClientRect().top + window.scrollY - 72;
    window.scrollTo({ top: y, behavior: 'smooth' });
  }, 120);
}

const PRAYER = ['默禱至誠，感通天地。', '凡事有疑，順理而行。', '不問吉凶，但問所當為。', '心定則明，明則能擇。'];

function Meditation({ done, onDone }) {
  const [lit, setLit] = useState(done ? PRAYER.length : 0);
  useEffect(() => {
    if (done) return;
    const io = new IntersectionObserver(es => {
      if (es[0].isIntersecting) { let i = 0; const iv = setInterval(() => { i++; setLit(i); if (i >= PRAYER.length) clearInterval(iv); }, 1300); io.disconnect(); }
    }, { threshold: .5 });
    const el = document.getElementById('medi-box'); el && io.observe(el);
    return () => io.disconnect();
  }, []);
  return (
    <div className="medi" id="medi-box">
      <div className="medi-vert">{PRAYER.map((p, i) => <span key={i} className={i < lit ? 'lit' : ''}>{p}<br /></span>)}</div>
      <div>
        <div className="breath"><span className="mono mute" style={{ fontSize: 11, position: 'relative' }}>吸 · 呼</span></div>
        <div className="kai" style={{ fontSize: 22, lineHeight: 1.6 }}>先別急著問。</div>
        <p className="mute" style={{ fontSize: 14, lineHeight: 1.9, margin: '8px 0 24px', maxWidth: 420 }}>跟著圓圈的節奏，吸氣四秒、吐氣四秒。在心裡把左側的禱詞默念一遍，讓問題慢慢沉澱成形。</p>
        {done ? <div className="done-mark">● 已靜心默禱</div>
          : <button className="btn primary" onClick={onDone}>我已靜心默禱</button>}
      </div>
    </div>
  );
}

function Composer({ q, setQ, cat, setCat, onNext, history, done, cast }) {
  const ex = CATS.find(c => c.name === cat);
  const similar = useMemo(() => {
    const t = q.trim(); if (t.length < 4 || cast) return null;
    const grams = s => { const g = new Set(); for (let i = 0; i < s.length - 1; i++) g.add(s.slice(i, i + 2)); return g; };
    const a = grams(t); const now = Date.now();
    return history.find(r => {
      if (now - r.time > 90 * 864e5) return false;
      const b = grams(r.question); let n = 0; a.forEach(x => b.has(x) && n++);
      return n / Math.max(1, Math.min(a.size, b.size)) > .55;
    });
  }, [q, history]);
  const ok = q.trim().length >= 4 && cat;
  return (
    <div>
      <div className="composer">
        <div className="composer-top">
          <div className="composer-meta"><span className="status-dot on" style={{ background: 'var(--accent)' }} /> 寫下具體的處境，而不只是「好不好」</div>
          <textarea rows={2} value={q} maxLength={200} placeholder={ex ? ex.ex : '例如：明年該不該離開現在的公司，去朋友的新創？'} onChange={e => setQ(e.target.value)}
            onKeyDown={e => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && ok) onNext(); }} />
          <div className="hint">好的提問包含：情境＋選項＋你在意的事。 <span className="mono">{q.length}/200</span></div>
        </div>
        <div className="chips">
          {CATS.map(c => (
            <button key={c.ch} className={'chip' + (cat === c.name ? ' on' : '')} onClick={() => setCat(c.name)} title={c.desc}>
              <span className="ch">{c.ch}</span>{c.name}
            </button>
          ))}
        </div>
        <div className="composer-foot">
          <div className="examples">
            {!q && ex && <button onClick={() => setQ(ex.ex)}>用範例：{ex.ex.slice(0, 14)}…</button>}
            {!cat && <span className="hint">先選一個主題</span>}
            {cat && q && <span className="hint">主題：{cat} · {ex.desc}</span>}
          </div>
          <button className="btn primary sm" disabled={!ok} onClick={onNext}>{done ? '已確認，往下' : '確認提問'} <span className="kbd">⌘↵</span></button>
        </div>
      </div>
      {similar && <div className="repeat-warn">你在 {fmtDate(similar.time).slice(0, 10)} 問過相似的問題（得「{window.YI.HEX[similar.result.ben - 1].full}」）。建議三個月內不重複占問；若情況已改變，試著換個角度提問。</div>}
    </div>
  );
}

function Methods({ sel, onPick }) {
  return (
    <div className="methods">
      {METHODS.map((m, i) => (
        <button key={m.id} className={'method' + (sel === m.id ? ' on' : '')} onClick={() => onPick(m.id)}>
          <div className="method-top">
            <div><div className="idx">{String(i + 1).padStart(2, '0')} · {m.time}</div><h3>{m.n}</h3><div className="sub">{m.sub}</div></div>
            <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 10 }}><span className="glyph kai">{m.glyph}</span><Level n={m.level} /></div>
          </div>
          <dl><dt>時機</dt><dd>{m.when}</dd><dt>原理</dt><dd className="mute">{m.how}</dd><dt>適合</dt><dd>{m.fit}</dd></dl>
        </button>
      ))}
    </div>
  );
}

function Sec({ id, num, title, desc, locked, children, doneLabel }) {
  return (
    <section id={id} className={'sec' + (locked ? ' locked' : '')} data-screen-label={num + ' ' + title}>
      <div className="sec-head">
        <div className="num">§ {num}</div>
        <h2>{title}</h2>
        {desc && <p>{desc}</p>}
        {doneLabel && <div className="done-mark">● {doneLabel}</div>}
      </div>
      <div style={{ minWidth: 0 }}>{children}</div>
    </section>
  );
}

function Home({ history, onSaved, apiKey, model, openSettings, flowKey, restart }) {
  const today = useMemo(todayHex, []);
  const [stage, setStage] = useState(0); // 0 none,1 medi done,2 question done,3 method chosen,4 cast done
  const [q, setQ] = useState('');
  const [cat, setCat] = useState('');
  const [method, setMethod] = useState('');
  const [rec, setRec] = useState(null);
  const [castKey, setCastKey] = useState(0);

  useEffect(() => { if (flowKey) { setStage(0); setQ(''); setCat(''); setMethod(''); setRec(null); scrollToId('s1'); } }, [flowKey]);

  const onCast = (values, extra) => {
    const r = { uid: window.ENGINE.uid(), time: Date.now(), category: cat, question: q.trim(), methodId: method, method: methodById(method).n,
      detail: extra.detail || '', result: window.ENGINE.buildResult(values), reading: '', readingSource: '' };
    setRec(r); setStage(4); onSaved(r); scrollToId('s5');
  };
  const onChange = r => { setRec(r); onSaved(r); };

  return (
    <div className="wrap">
      <div className="hero" data-screen-label="00 首頁">
        <div>
          <div className="eyebrow">— 一個幫你想清楚的地方</div>
          <h1>有疑，<br /><em>才</em>問。</h1>
          <p className="hero-lede">不是算命。是借《易經》六十四種處境，把卡住你的那件事攤開來看——看局勢、看風險，最後由你自己做選擇。</p>
          <div className="hero-actions">
            <button className="btn primary" onClick={() => scrollToId('s1')}>靜心，開始 ↓</button>
            <span className="hint">約 3–8 分鐘 · 不需註冊 · 紀錄只存在你的裝置</span>
          </div>
        </div>
        <div className="today">
          <div className="ring" />
          <div className="today-top"><span>今日一卦</span><span>No. {today.num} / 64</span></div>
          <div className="today-body">
            <Hex bits={today.bits} w={120} h={12} gap={10} anim delay={.3} />
            <div><div className="today-name">{today.name}</div><div className="mono mute" style={{ fontSize: 11, marginTop: 10 }}>{today.full} · {today.upper}上{today.lower}下</div></div>
          </div>
          <div><div className="today-quote">「{today.judge.length > 34 ? today.judge.slice(0, 34) + '…' : today.judge}」</div>
            <div className="mute" style={{ fontSize: 13, marginTop: 8, lineHeight: 1.7 }}>{today.plain}</div></div>
        </div>
      </div>

      <Sec id="s0" num="00" title="問之前，先過三關" desc="朱子說：易，是為了「決疑」而存在。以下三種情況，就先別問了。">
        <div className="principles">
          {[['不誠不占', '心還亂著，先別問。等安靜下來，問題自然會變清楚。'], ['不義不占', '想做的事本身不正當，答案也幫不了你。'], ['不疑不占', '心裡早有答案，就去做吧。不必找卦背書。']].map(([t, d], i) => (
            <div key={t} className="principle"><div className="n">0{i + 1}</div><h3>{t}</h3><p>{d}</p></div>
          ))}
        </div>
      </Sec>

      <Sec id="s1" num="01" title="靜心" desc="三十秒，讓心慢下來。" doneLabel={null}>
        <Meditation done={stage >= 1} onDone={() => { setStage(s => Math.max(s, 1)); scrollToId('s2'); }} />
      </Sec>

      <Sec id="s2" num="02" title="今天，想把什麼想清楚？" desc="選一個主題，寫下你的疑問。問題越具體，卦象給你的角度越清晰。" locked={stage < 1}>
        <Composer q={q} setQ={setQ} cat={cat} setCat={setCat} history={history} done={stage >= 2} cast={stage >= 4}
          onNext={() => { setStage(s => Math.max(s, 2)); scrollToId('s3'); }} />
      </Sec>

      <Sec id="s3" num="03" title="選一種起卦方式" desc="方法沒有高下，只有適不適合當下。■ 代表儀式的莊重程度。" locked={stage < 2}>
        <Methods sel={method} onPick={id => { if (stage >= 4) return; setMethod(id); setCastKey(k => k + 1); setStage(3); scrollToId('s4'); }} />
        {stage >= 4 && <div className="hint" style={{ marginTop: 12 }}>本次已成卦。若要重新開始，請在下方按「再問一件事」。</div>}
      </Sec>

      <Sec id="s4" num="04" title="起卦" desc={method ? methodById(method).n + '｜' + methodById(method).sub : '等待選擇方式'} locked={stage < 3}>
        {method ? <div key={castKey} style={{ pointerEvents: stage >= 4 ? 'none' : 'auto', opacity: stage >= 4 ? .6 : 1 }}><MethodStage method={method} onDone={onCast} /></div>
          : <div className="stage" style={{ gridTemplateColumns: '1fr', placeItems: 'center' }}><span className="hint">選擇起卦方式後，這裡會出現互動。</span></div>}
      </Sec>

      <Sec id="s5" num="05" title="觀象，然後自省" desc="卦象指出處境，不替你做決定。讀完後，留一個本週就能做的行動。" locked={stage < 4}>
        {rec ? <>
          <ResultView rec={rec} onChange={onChange} apiKey={apiKey} model={model} onOpenSettings={openSettings} />
          <div className="res-actions"><button className="btn ghost" onClick={restart}>再問一件事</button></div>
        </> : <div className="res-head" style={{ gridTemplateColumns: '1fr', placeItems: 'center', minHeight: 220 }}><span className="hint">卦成之後，本卦、變爻、之卦與解讀會出現在這裡。</span></div>}
      </Sec>

      <div className="foot"><span>卦象是鏡子，不是判決書。真正決定結果的，是你接下來怎麼做。</span><span className="mono">有疑才問 · Prototype 2026</span></div>
    </div>
  );
}

Object.assign(window, { Home, scrollToId });

<script type="text/babel">var { useState, useEffect, useRef, useMemo, useCallback } = React;
// 有疑才問 — 我的紀錄、卦典、設定
function HistoryPage({ history, setHistory, apiKey, model, openSettings, toast }) {
  const Y = window.YI, E = window.ENGINE;
  const [kw, setKw] = useState('');
  const [sort, setSort] = useState('new');
  const [cat, setCat] = useState('全部');
  const [open, setOpen] = useState(null);
  const fileRef = useRef(null);

  const list = useMemo(() => {
    const k = kw.trim().toLowerCase();
    let l = history.filter(r => cat === '全部' || r.category === cat);
    if (k) l = l.filter(r => {
      const b = Y.HEX[r.result.ben - 1], z = r.result.zhi ? Y.HEX[r.result.zhi - 1] : null;
      return [r.question, b.name, b.full, z && z.name, z && z.full, r.method].filter(Boolean).join(' ').toLowerCase().includes(k);
    });
    return [...l].sort((a, b) => sort === 'new' ? b.time - a.time : a.time - b.time);
  }, [history, kw, sort, cat]);

  const del = uid => { if (!confirm('刪除這筆紀錄？')) return; const l = history.filter(r => r.uid !== uid); E.saveHistory(l); setHistory(l); setOpen(null); };
  const delAll = () => { if (!history.length || !confirm(`確定刪除全部 ${history.length} 筆紀錄？此動作無法復原。`)) return; E.saveHistory([]); setHistory([]); };
  const onImport = async e => {
    const fs = [...e.target.files]; e.target.value = '';
    let n = 0, errs = [];
    for (const f of fs) { try { n += E.mergeImport(await E.importFile(f)); } catch (er) { errs.push(f.name + '：' + er.message); } }
    setHistory(E.loadHistory());
    toast(errs.length ? errs[0] : n ? `已匯入 ${n} 筆紀錄` : '紀錄已存在，沒有新增');
  };
  const exportJson = () => {
    const b = new Blob([JSON.stringify(history, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = '有疑才問_全部紀錄.json'; a.click();
  };
  const cur = open && history.find(r => r.uid === open);
  const update = r => { const l = E.upsert(r); setHistory(l); };

  return (
    <div className="wrap" data-screen-label="10 我的紀錄">
      <div className="page-hd">
        <div><div className="eyebrow">我的紀錄 · {history.length} 筆</div><h1>問過的事</h1>
          <p>所有紀錄只保存在這台裝置的瀏覽器中。換裝置時，匯出 PDF 再於新裝置匯入即可還原。</p></div>
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
          <input ref={fileRef} type="file" accept=".pdf,.json,application/pdf,application/json" multiple hidden onChange={onImport} />
          <button className="btn ghost sm" onClick={() => fileRef.current.click()}>匯入 PDF / JSON</button>
          <button className="btn ghost sm" onClick={exportJson} disabled={!history.length}>備份全部 JSON</button>
          <button className="btn ghost sm" onClick={delAll} disabled={!history.length} style={{ color: 'var(--warn)' }}>全部刪除</button>
        </div>
      </div>
      <div className="toolbar">
        <div className="search"><span className="mute">⌕</span><input value={kw} onChange={e => setKw(e.target.value)} placeholder="搜尋問題或卦名，例如「復」" />{kw && <button className="link mute" style={{ border: 0 }} onClick={() => setKw('')}>清除</button>}</div>
        <select className="select" value={sort} onChange={e => setSort(e.target.value)}><option value="new">日期：新 → 舊</option><option value="old">日期：舊 → 新</option></select>
      </div>
      <div className="filters">{['全部', ...CATS.map(c => c.name)].map(c => <button key={c} className={'fchip' + (cat === c ? ' on' : '')} onClick={() => setCat(c)}>{c}</button>)}</div>

      {list.length ? <div className="rec-grid">
        {list.map((r, i) => {
          const b = Y.HEX[r.result.ben - 1], z = r.result.zhi ? Y.HEX[r.result.zhi - 1] : null;
          return (
            <div key={r.uid} className="rec" style={{ animationDelay: Math.min(i, 10) * .04 + 's', cursor: 'pointer' }} onClick={() => setOpen(r.uid)}>
              <div className="rec-top"><span>{fmtDate(r.time)}</span><span>{r.category} · {r.method}</span></div>
              <p className="rec-q">{r.question}</p>
              <div className="rec-hex"><Hex bits={b.bits} moving={r.result.moving} w={34} h={4} gap={3} />
                <div><div className="t">{b.full}{z && <span className="mute"> → {z.name}</span>}</div><div className="m">{r.result.moving.length ? r.result.moving.length + ' 爻變' : '靜卦'}{r.readingSource === 'gemini' ? ' · Gemini 解讀' : r.reading ? ' · 範例解讀' : ''}</div></div></div>
              <div className="rec-foot"><span className="mono mute" style={{ fontSize: 10 }}>{r.uid}</span>
                <button className="link mute" style={{ fontSize: 12, border: 0 }} onClick={e => { e.stopPropagation(); del(r.uid); }}>刪除</button></div>
            </div>
          );
        })}
      </div> : <div className="empty"><span className="kai">{history.length ? '沒有符合的紀錄' : '還沒有紀錄'}</span>{history.length ? '換個關鍵字或主題試試。' : '完成第一次占問後，會自動保存在這裡。'}</div>}

      {cur && <Drawer title={'紀錄 · ' + cur.uid} onClose={() => setOpen(null)} actions={<button className="icon-btn" onClick={() => del(cur.uid)}>刪除</button>}>
        <div className="mono mute" style={{ fontSize: 11, marginBottom: 14 }}>{fmtDate(cur.time)} · {cur.category} · {cur.method}{cur.detail ? ' · ' + cur.detail : ''}</div>
        <ResultView rec={cur} onChange={update} apiKey={apiKey} model={model} compact onOpenSettings={openSettings} />
      </Drawer>}
    </div>
  );
}

function LibraryPage() {

  const h = open && Y.HEX[open - 1];

  const SYM = { 乾: '☰', 兌: '☱', 離: '☲', 震: '☳', 巽: '☴', 坎: '☵', 艮: '☶', 坤: '☷' };

  const houPos = { 離: 0, 坤: 45, 兌: 90, 乾: 135, 坎: 180, 艮: 225, 震: 270, 巽: 315 };

            <div style={{ textAlign: 'center' }}><Hex bits={[0]} w={80} h={10} /><div className="kai" style={{ marginTop: 10 }}>陰爻 ⚋</div><div className="hint">柔、靜、守</div></div>

          <p>陰陽不是好壞，而是互相轉化的兩種狀態。老陽（9）、老陰（6）到了極點就會變，稱為「變爻」。</p></div>
        <div className="basic"><div className="mono mute" style={{ fontSize: 11 }}>02 · 爻位</div><h3>由下而上，六個階段</h3>
          <div style={{ display: 'flex', gap: 18, alignItems: 'center' }}>
            <Hex bits={[1, 0, 1, 0, 1, 0]} w={64} h={6} gap={6} />
            <div className="mono" style={{ fontSize: 11, lineHeight: '12px', display: 'flex', flexDirection: 'column-reverse', gap: 0 }}>
              {['初 · 地 · 萌芽', '二 · 地 · 得中', '三 · 人 · 轉折', '四 · 人 · 近君', '五 · 天 · 尊位', '上 · 天 · 極致'].map(t => <div key={t} className="mute">{t}</div>)}</div>

        <div className="basic"><div className="mono mute" style={{ fontSize: 11 }}>03 · 八卦</div><h3>三爻成卦，八種意象</h3>
          <table className="tri-tbl"><thead><tr><th></th><th>卦</th><th>象</th><th>性</th><th>口訣</th></tr></thead>
            <tbody>{Y.TRI_ORDER.map(k => <tr key={k}><td className="sym">{SYM[k]}</td><td className="kai">{k}</td><td>{Y.TRI[k].nature}</td><td className="mute">{Y.TRI[k].attr}</td><td className="kai mute">{Y.TRI[k].song}</td></tr>)}</tbody></table></div>
      </div>

      <div className="bagua-wrap">
        <div className="bagua">
          {Y.TRI_ORDER.map(k => {
            const a = (pos[k] - 90) * Math.PI / 180;
            return <div key={k} className="tg" style={{ transform: `translate(${Math.cos(a) * R}px, ${Math.sin(a) * R}px)` }}>
              <div className="sym">{SYM[k]}</div><div className="n">{k}・{Y.TRI[k].nature}</div><div className="d">{order === 'xian' ? Y.TRI[k].xianDir : Y.TRI[k].houDir}</div></div>;

        </div>
        <div className="panel" style={{ marginBottom: 14 }}><h4>卦辭</h4><p className="focus-txt">{h.judge}</p>
          <div style={{ fontSize: 14, lineHeight: 1.85, borderTop: '1px solid var(--line)', paddingTop: 14, marginTop: 14 }}><span className="mono mute" style={{ fontSize: 11 }}>白話　</span>{h.plain}</div></div>
        <div className="panel"><h4><span>六爻爻辭</span><span>由上而下</span></h4>
          <div className="lines-tbl">
            {[5, 4, 3, 2, 1, 0].map(i => { const a = E.lineAnalysis(h.bits, i); return (
              <div key={i} className="line-row"><div className="lab">{h.lines[i].label}</div>
                <div><div className="txt" style={{ fontFamily: 'var(--kai)', fontSize: 16 }}>{h.lines[i].text}</div>
                  {window.YI_PLAIN && window.YI_PLAIN[h.num] && <div className="plain">{window.YI_PLAIN[h.num][i]}</div>}
                  <div className="tags"><span className={'tag ' + (a.proper ? 'good' : 'bad')}>{a.proper ? '當位' : '失正'}</span>{a.center && <span className="tag good">得中</span>}<span className="tag">{a.ying ? '有應' : '無應'}</span><span className="tag">{a.cai}位 · {a.pos}</span></div></div></div>); })}
            {h.extra && <div className="line-row"><div className="lab accent">{h.extra.slice(0, 2)}</div><div><div className="txt" style={{ fontFamily: 'var(--kai)', fontSize: 16 }}>{h.extra.slice(3)}</div>{window.YI_PLAIN && window.YI_PLAIN[h.num] && window.YI_PLAIN[h.num][6] && <div className="plain">{window.YI_PLAIN[h.num][6]}</div>}</div></div>}
          </div>
        </div>
        <div className="notice" style={{ marginTop: 14 }}><div className="glyph">用</div><div><h4>放到生活裡</h4><p>{h.plain} 在工作上，留意自己目前處在哪一爻的階段；在關係中，看看彼此是「有應」還是「無應」。</p></div></div>
      </Drawer>}
    </div>
  );
}

function SettingsModal({ onClose, apiKey, setApiKey, model, setModel, toast }) {
  const [k, setK] = useState(apiKey);
  const [show, setShow] = useState(false);
  const [testing, setTesting] = useState(false);
  const [models, setModels] = useState([]);
  const save = async () => { await window.ENGINE.saveKey(k.trim()); setApiKey(k.trim()); toast(k.trim() ? '已加密儲存於本機' : '已清除 API Key'); onClose(); };
  const test = async () => {
    setTesting(true);
    try {
      const l = await window.ENGINE.listModels(k.trim());
      setModels(l);
      toast(l.length ? `連線成功 · 找到 ${l.length} 個可用模型` : '連線成功，但沒有可用的文字模型');
    } catch (e) { toast('連線失敗：' + e.message.slice(0, 60)); }
    setTesting(false);
  };
  useEffect(() => { const f = e => e.key === 'Escape' && onClose(); window.addEventListener('keydown', f); return () => window.removeEventListener('keydown', f); }, []);
  return (<>
    <div className="scrim" onClick={onClose} />
    <div className="modal" data-screen-label="30 設定">
      <div className="eyebrow">設定</div>
      <h2 className="kai" style={{ fontWeight: 400, fontSize: 30, margin: '10px 0 8px' }}>Gemini AI 解卦</h2>
      <p className="mute" style={{ fontSize: 13, lineHeight: 1.8, margin: 0 }}>填入你自己的 Google Gemini API Key，就能針對問題取得完整解讀。金鑰以 AES-GCM 加密後只存在這台裝置，不會上傳到任何其他伺服器。沒有金鑰時，會顯示依卦象自動整理的範例解讀。</p>
      <div className="field"><label>API Key</label>
        <div style={{ display: 'flex', gap: 8 }}><input style={{ flex: 1 }} type={show ? 'text' : 'password'} value={k} onChange={e => setK(e.target.value)} placeholder="AIza…" />
          <button className="icon-btn" style={{ height: 46, borderRadius: 12 }} onClick={() => setShow(!show)}>{show ? '隱藏' : '顯示'}</button></div>
        <span className="hint">可於 Google AI Studio 免費申請：aistudio.google.com/apikey</span></div>
      <div className="field"><label>模型</label>
        <select value={model} onChange={e => setModel(e.target.value)}>
          <option value="auto">自動選擇（建議）— 依你的帳號可用模型挑選</option>
          {[...new Set([...(models || []), ...(model !== 'auto' ? [model] : [])])].map(m => <option key={m} value={m}>{m}</option>)}
        </select>
        <span className="hint">Google 會不定期下架舊模型。「自動」會先查詢此 Key 可用的模型，失敗時自動改用下一個。按「測試連線」可列出可選模型。</span></div>
      <div style={{ display: 'flex', gap: 10, justifyContent: 'space-between', marginTop: 24, flexWrap: 'wrap' }}>
        <button className="btn ghost sm" onClick={test} disabled={!k.trim() || testing}>{testing ? '測試中…' : '測試連線'}</button>
        <div style={{ display: 'flex', gap: 10 }}><button className="btn ghost sm" onClick={onClose}>取消</button><button className="btn primary sm" onClick={save}>儲存</button></div>
      </div>
    </div>
  </>);
}

Object.assign(window, { HistoryPage, LibraryPage, SettingsModal });
</script>
<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "palette": "celadon",
  "head": "kai",
  "splash": true
}/*EDITMODE-END*/;

const PALETTES = {
  celadon: { light: { '--bg':'#E4EAE6','--paper':'#EEF2EF','--deep':'#D2DCD6','--line':'#BFCBC4','--accent':'#A3652C','--ink':'#1E2827','--mute':'#56635F' },
             dark:  { '--bg':'#111513','--paper':'#181D1B','--deep':'#212826','--line':'#2C3532','--accent':'#C98A4E','--ink':'#E4E9E5','--mute':'#94A09A' } },
  graphite: { light: { '--bg':'#EDEBE6','--paper':'#F6F4F0','--deep':'#DEDAD2','--line':'#D2CDC3','--accent':'#B5372A','--ink':'#1C1B19','--mute':'#6F6B63' },
              dark:  { '--bg':'#131211','--paper':'#1B1A18','--deep':'#25231F','--line':'#2F2C28','--accent':'#D0574A','--ink':'#ECE8DF','--mute':'#9A958A' } },
  night:   { light: { '--bg':'#F1EEE6','--paper':'#F9F7F2','--deep':'#E3DED2','--line':'#D6D0C2','--accent':'#9C7A3C','--ink':'#1B1A17','--mute':'#6C675D' },
             dark:  { '--bg':'#0F0F0E','--paper':'#181816','--deep':'#1F1F1C','--line':'#2B2A26','--accent':'#C8A76A','--ink':'#ECE8DF','--mute':'#8A857A' } },
};

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [splash, setSplash] = useState(() => t.splash && !sessionStorage.getItem('ysw.splashSeen'));
  const [page, setPage] = useState(() => localStorage.getItem('ysw.page') || 'home');
  const [history, setHistory] = useState(window.ENGINE.loadHistory);
  const [apiKey, setApiKey] = useState('');
  const [model, setModel] = useState(() => (() => { const m = localStorage.getItem('ysw.model'); return !m || /2\.5-pro|2\.0-flash$/.test(m) ? 'auto' : m; })());
  const [settings, setSettings] = useState(false);
  const [toastMsg, setToastMsg] = useState('');
  const [flowKey, setFlowKey] = useState(0);
  const [scrolled, setScrolled] = useState(false);

  useEffect(() => { window.ENGINE.loadKey().then(setApiKey); }, []);
  useEffect(() => { localStorage.setItem('ysw.page', page); window.scrollTo(0, 0); }, [page]);
  useEffect(() => { localStorage.setItem('ysw.model', model); }, [model]);
  useEffect(() => { const f = () => setScrolled(window.scrollY > 10); window.addEventListener('scroll', f); return () => window.removeEventListener('scroll', f); }, []);
  useEffect(() => {
    const r = document.documentElement;
    r.dataset.theme = t.theme; r.dataset.head = t.head;
    const p = (PALETTES[t.palette] || PALETTES.celadon)[t.theme === 'dark' ? 'dark' : 'light'];
    Object.entries(p).forEach(([k, v]) => r.style.setProperty(k, v));
  }, [t.theme, t.palette, t.head]);

  const toast = m => { setToastMsg(m); clearTimeout(window.__tt); window.__tt = setTimeout(() => setToastMsg(''), 2600); };
  const onSaved = r => setHistory(window.ENGINE.upsert(r));
  const go = p => setPage(p);
  const restart = () => { setPage('home'); setFlowKey(k => k + 1); };
  const tabs = [['home', '起卦', '問'], ['history', '我的紀錄', '錄'], ['library', '卦典', '典']];

  return (<>
    {splash && <Splash onDone={() => { sessionStorage.setItem('ysw.splashSeen', '1'); setSplash(false); }} />}
    <header className={'hdr' + (scrolled ? ' scrolled' : '')}>
      <button className="logo" onClick={() => go('home')}>
        <span className="logo-mark"><Hex bits={[1,0,0,0,0,0]} w={13} h={1.8} gap={1.6} /></span>有疑才問<span className="dot">。</span>
      </button>
      <nav className="nav">{tabs.map(([k, l]) => <button key={k} className={page === k ? 'on' : ''} onClick={() => go(k)}>{l}{k === 'history' && history.length ? <span className="mono mute" style={{ fontSize: 10, marginLeft: 6 }}>{history.length}</span> : null}</button>)}</nav>
      <div className="hdr-tools">
        <button className="icon-btn" onClick={() => setSettings(true)} title="Gemini API 設定"><span className={'status-dot' + (apiKey ? ' on' : '')} /><span className="hide-m">{apiKey ? 'Gemini 已連線' : 'AI 設定'}</span><span style={{ display: 'none' }} className="show-m">AI</span></button>
        <button className="icon-btn" onClick={() => setTweak('theme', t.theme === 'dark' ? 'light' : 'dark')} title="切換明暗">{t.theme === 'dark' ? '○' : '●'}</button>
      </div>
    </header>

    {page === 'home' && <Home history={history} onSaved={onSaved} apiKey={apiKey} model={model} openSettings={() => setSettings(true)} flowKey={flowKey} restart={restart} />}
    {page === 'history' && <HistoryPage history={history} setHistory={setHistory} apiKey={apiKey} model={model} openSettings={() => setSettings(true)} toast={toast} />}
    {page === 'library' && <LibraryPage />}

    <nav className="tabbar">{tabs.map(([k, l, g]) => <button key={k} className={page === k ? 'on' : ''} onClick={() => go(k)}><span className="g">{g}</span>{l}</button>)}
      <button onClick={() => setSettings(true)}><span className="g">{apiKey ? '●' : '○'}</span>設定</button></nav>

    {settings && <SettingsModal onClose={() => setSettings(false)} apiKey={apiKey} setApiKey={setApiKey} model={model} setModel={setModel} toast={toast} />}
    <Toast msg={toastMsg} />

    <TweaksPanel>
      <TweakSection label="外觀">
        <TweakRadio label="明暗" value={t.theme} options={[{ value: 'light', label: '淺色' }, { value: 'dark', label: '深色' }]} onChange={v => setTweak('theme', v)} />
        <TweakRadio label="配色" value={t.palette} options={[{ value: 'celadon', label: '青瓷' }, { value: 'graphite', label: '石墨' }, { value: 'night', label: '夜讀' }]} onChange={v => setTweak('palette', v)} />
        <TweakRadio label="標題字體" value={t.head} options={[{ value: 'kai', label: '文楷' }, { value: 'serif', label: '宋體' }]} onChange={v => setTweak('head', v)} />
      </TweakSection>
      <TweakSection label="開場">
        <TweakToggle label="顯示開場動畫" value={t.splash} onChange={v => setTweak('splash', v)} />
        <TweakButton label="重播開場動畫" secondary onClick={() => setSplash(true)} />
      </TweakSection>
      <TweakSection label="示範資料">
        <TweakButton label="加入 3 筆示範紀錄" secondary onClick={() => {
          const E = window.ENGINE; const qs = [['工作','要不要接下新團隊的主管職？','coin'],['姻緣','和對方的關係該怎麼往下走？','card'],['財運','今年的投資配置是否太積極？','three']];
          qs.forEach(([c, q, m], i) => { const vals = Array.from({ length: 6 }, () => E.coinLine().v); const r = { uid: E.uid() + i, time: Date.now() - (i + 1) * 9 * 864e5, category: c, question: q, methodId: m, method: methodById(m).n, detail: '示範', result: E.buildResult(vals), reading: '', readingSource: '' }; r.reading = E.sampleReading(r); r.readingSource = 'sample'; E.upsert(r); });
          setHistory(E.loadHistory()); toast('已加入示範紀錄');
        }} />
      </TweakSection>
    </TweaksPanel>
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
